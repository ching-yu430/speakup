<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Speak Up">
<link rel="apple-touch-icon" href="apple-touch-icon.jpg">
<link rel="icon" href="apple-touch-icon.jpg">
<title>開口練習 Speak Up</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#20261f;
    --paper:#f6f3ea;
    --card:#ffffff;
    --sage:#5c7a5e;
    --sage-dark:#3c5a3e;
    --sage-light:#e4ebe0;
    --clay:#c17a52;
    --clay-light:#f3e2d5;
    --line:#dcd6c4;
    --muted:#8a8577;
    --ai:#8c5f8a;
    --ai-dark:#6b4569;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ede5;
      --paper: #161815;
      --card: #20241f;
      --sage: #7da080;
      --sage-dark: #a8cdab;
      --sage-light: #2c362d;
      --clay: #d6956e;
      --clay-light: #4a3020;
      --line: #373e35;
      --muted: #8b968a;
      --ai: #c494c2;
      --ai-dark: #e8bce6;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    transition: background-color 0.2s, color 0.2s;
  }
  input, select, textarea {
    font-size: 16px !important; /* Prevent iOS Safari auto-zoom */
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.7; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--sage); }
  .wrap{
    max-width:720px;margin:0 auto;
    padding:40px 20px calc(80px + env(safe-area-inset-bottom));
    padding-left:calc(20px + env(safe-area-inset-left));
    padding-right:calc(20px + env(safe-area-inset-right));
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:8px;
  }
  .brand{
    font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;
    font-size:16px;color:var(--sage-dark);white-space:nowrap;flex-shrink:0;
  }
  .triple-bar{
    display:flex;gap:6px;flex:1;min-width:0;
  }
  .trigger-btn{
    flex:1;min-width:0;min-height:42px;
    display:flex;align-items:center;justify-content:center;gap:4px;
    padding:0 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);
    font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;color:var(--ink);
    cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none;
  }
  .trigger-btn:hover{border-color:var(--sage);}
  .trigger-btn.open{background:var(--sage);color:#fff;border-color:var(--sage);}
  .trigger-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trigger-caret{font-size:10px;flex-shrink:0;transition:transform .2s;opacity:.7;}
  .trigger-btn.open .trigger-caret{transform:rotate(180deg);}

  .dropdown-panel{
    display:none;margin-bottom:6px;padding:12px;
    background:var(--sage-light);border-radius:14px;
  }
  .dropdown-panel.open{display:block;}
  .dropdown-panel .app-tabs{margin-bottom:0;}
  .dropdown-panel .ladder{margin:0 0 8px;}
  .dropdown-panel .stage-desc{margin-bottom:0;}
  .dropdown-panel .cats{margin-bottom:0;}

  .app-tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--sage-light); border-radius: 12px;
  }
  .app-tab {
    flex: 1; min-height: 58px; padding: 6px 2px; border: none; background: transparent;
    border-radius: 10px; font-weight: 600; color: var(--muted);
    cursor: pointer; transition: all 0.2s; line-height: 1.2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 2px;
    -webkit-user-select: none; user-select: none;
  }
  .app-tab.active { background: var(--card); color: var(--sage-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .tab-icon { font-size: 20px; line-height: 1; }
  .tab-label { font-size: 10.5px; font-weight: 700; letter-spacing: -0.01em; }

  .review-container{ margin-bottom:20px; }
  details.review-group{ margin-bottom:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 14px; }
  details.review-group summary{
    font-size:14px; font-weight:700; color:var(--sage-dark); padding:12px 0;
    display:flex; justify-content:space-between; align-items:center;
    cursor: pointer; list-style: none; -webkit-user-select: none; user-select: none;
  }
  details.review-group summary::-webkit-details-marker { display: none; }
  .review-group-title-left { display:flex; align-items:center; gap:8px; }
  .review-group-title-left::before {
    content: '▶'; font-size: 10px; color:var(--muted); transition: transform 0.2s; display:inline-block;
  }
  details.review-group[open] .review-group-title-left::before { transform: rotate(90deg); }
  .review-group-items { padding-top:4px; padding-bottom:12px; border-top:1px dashed var(--line); margin-top:4px; }
  .review-group-count{ color:var(--muted); font-weight:500; font-size:13px; }
  .review-item{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer; transition:all .15s;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .review-item:hover{ border-color:var(--sage); }
  .review-item-en{ font-weight:600; font-size:14px; }
  .review-item-zh{ font-size:12px; color:var(--muted); margin-top:2px; }
  .review-empty{
    text-align:center; color:var(--muted); font-size:14px; padding:40px 20px;
  }

  .ai-actions { margin-bottom: 16px; }
  .ai-create-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: 2px dashed var(--ai);
    background: rgba(140,95,138,0.06); color: var(--ai-dark); font-weight: bold; font-size: 14px;
    cursor: pointer; transition: all 0.2s;
  }
  .ai-create-btn:hover { background: rgba(140,95,138,0.12); }
  
  .ai-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
    display: none; justify-content: center; align-items: center; z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .ai-modal-overlay.show { display: flex; }
  .ai-modal {
    background: var(--card); width: 90%; max-width: 400px; padding: 24px;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative;
  }
  .ai-modal-close {
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    font-size: 24px; cursor: pointer; color: var(--muted);
  }

  .ladder{
    display:flex;gap:6px;margin:16px 0 10px;
  }
  .rung{
    flex:1;padding:12px 6px;text-align:center;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
    transition:all .2s;
  }
  .rung.active{
    background:var(--sage);color:#fff;border-color:var(--sage);
  }

  .stage-desc{
    font-size:13px;color:var(--muted);margin-bottom:10px;padding-left:2px;
  }

  .cats{
    display:flex;gap:8px;margin-bottom:14px;
    overflow-x:auto; padding-bottom:4px; flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar { display:none; }
  .cat-pill{
    flex-shrink:0;min-height:38px;display:flex;align-items:center;
    padding:0 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:13px;color:var(--muted);cursor:pointer;
    font-weight:500;transition:all .15s;
  }
  .cat-pill.active{background:var(--clay);color:#fff;border-color:var(--clay);}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;margin-bottom:20px;
  }

  .target-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .target-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .target-cat{font-size:12px;color:var(--clay);font-weight:600;}
  .target{
    font-family:'Fraunces',serif;font-size:clamp(24px, 6.5vw, 32px);font-weight:500;
    color:var(--ink);margin-bottom:6px;line-height:1.4;
  }
  .clickable-word {
    cursor: pointer;
    transition: color 0.15s;
    border-bottom: 1px dashed transparent;
  }
  .clickable-word:hover {
    color: var(--sage);
    border-bottom: 1px dashed var(--sage);
  }
  .target-zh{color:var(--muted);font-size:15px;margin-bottom:24px;}

  .phon-block{margin:-8px 0 22px;background:var(--sage-light);border-radius:12px;padding:14px 16px;}
  .phon-label{font-size:11px;letter-spacing:.05em;color:var(--sage-dark);margin-bottom:8px;font-weight:700;text-transform:uppercase;}
  .phon-visual{font-family:'Fraunces',serif;font-size:15px;color:var(--sage-dark);letter-spacing:.04em;line-height:1.8;}
  .phon-visual .syl{transition:all .15s;text-transform:lowercase;}
  .phon-visual .syl.stressed{
    font-size:19px;font-weight:700;color:var(--clay);text-transform:uppercase;
    background:rgba(193,122,82,0.1);border-radius:4px;padding:0 2px;
  }
  .phon-visual .syl.secondary{font-size:16px;font-weight:600;color:var(--sage-dark);}
  .phon-visual .dot{color:var(--muted);padding:0 3px;font-size:13px;font-weight:400;opacity:0.7;}
  .phon-raw-row{font-size:11px;color:var(--muted);margin-top:8px;font-family:'Inter',sans-serif;border-top:1px dashed rgba(92,122,94,0.2);padding-top:6px;}

  .accent-row{display:flex;gap:6px;margin-bottom:2px;}
  .accent-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    border-radius:999px;border:1px solid var(--line);background:#fff;
    min-height:36px;padding:0 14px;cursor:pointer;color:var(--muted);
    -webkit-user-select:none;user-select:none;
  }
  .accent-btn.active{background:var(--sage-light);color:var(--sage-dark);border-color:var(--sage);}

  .controls {
    display: flex; justify-content: center; align-items: center; gap: 20px;
    margin: 16px 0 16px;
  }
  .btn-mic {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--clay); color: #fff; border: none;
    font-size: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(193,122,82,0.3); transition: all 0.2s; padding: 0;
  }
  .btn-mic:hover { transform: scale(1.05); }
  .btn-mic:active { transform: scale(0.95); }
  .btn-mic.recording {
    background: #e63946; box-shadow: 0 0 0 0 rgba(230,57,70,0.5);
    animation: pulse-rec-new 1.2s ease-in-out infinite;
  }
  @keyframes pulse-rec-new {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
    50% { box-shadow: 0 0 0 16px rgba(230,57,70,0); }
  }
  .btn-play {
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--sage-light); color: var(--sage-dark); border: none;
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; padding: 0;
  }
  .btn-play:hover { background: var(--sage); color: #fff; }
  .btn-play-slow { background: #f1f5f9; color: #475569; font-size: 24px; }
  .btn-play-slow:hover { background: #e2e8f0; color: #334155; }

  .quick-nav{
    display:flex;align-items:center;justify-content:center;gap:16px;
    margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  }
  .nav-arrow{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;-webkit-user-select:none;user-select:none;padding:0;
  }
  .nav-arrow:hover{border-color:var(--sage);color:var(--sage-dark);}
  .nav-arrow:active{transform:scale(.92);}
  .quick-nav .counter{font-size:13px;color:var(--muted);min-width:64px;text-align:center;}
  #recBtn{touch-action:none;-webkit-user-select:none;user-select:none;}

  .live-transcript{
    margin-top:10px;font-size:14px;color:var(--muted);font-style:italic;
    min-height:22px;transition:opacity .2s;
  }
  .live-transcript:empty{opacity:0;}
  .live-transcript:not(:empty){opacity:1;}

  .result{
    margin-top:20px;padding-top:20px;border-top:1px solid var(--line);
    display:none;
  }
  .result.show{display:block;}
  .you-said{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .heard{font-size:18px;margin-bottom:14px;}
  .feedback{
    font-size:14px;padding:12px 16px;border-radius:10px;
    background:var(--sage-light);color:var(--sage-dark);
  }
  .feedback.retry{background:var(--clay-light);color:#8a4a26;}

  .counter{font-size:13px;color:var(--muted);}
  .skip{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;font-weight:400;}

  details.add-panel{
    margin-top:28px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 18px;
  }
  details.add-panel summary{
    cursor:pointer;font-size:13px;font-weight:600;color:var(--sage-dark);
    list-style:none;-webkit-user-select:none;user-select:none;
    display:flex;align-items:center;gap:6px;
  }
  details.add-panel summary::before{content:'✎';font-size:13px;}
  details.add-panel summary::-webkit-details-marker{display:none;}
  .add-body{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
    display:flex;flex-direction:column;gap:12px;
  }
  .add-field{display:flex;flex-direction:column;gap:5px;}
  .add-label{font-size:12px;color:var(--muted);font-weight:600;}
  .add-field input, .add-field select{
    width:100%;padding:10px 12px;border-radius:10px;
  }
  .add-submit-btn{
    margin-top:2px;padding:12px;border:none;border-radius:10px;
    background:var(--sage);color:#fff;font-weight:700;font-size:14px;
    cursor:pointer;transition:background .15s;
  }
  .add-submit-btn:hover{background:var(--sage-dark);}
  .add-submit-btn:disabled{opacity:.7;cursor:default;}

  .mobile-note{
    background:var(--sage-light);color:var(--sage-dark);padding:14px 18px;
    border-radius:12px;font-size:13px;margin-bottom:20px;display:none;
  }
  .no-support{
    background:var(--clay-light);color:#8a4a26;padding:16px 20px;
    border-radius:12px;font-size:14px;margin-bottom:24px;
  }

  .msg-sys{text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px;}
  .msg-user{background:var(--sage-light);color:var(--ink);align-self:flex-end;border-radius:12px 12px 0 12px;padding:12px 16px;max-width:85%;font-size:15px;line-height:1.4;}
  .msg-ai{background:var(--card);color:var(--ink);border:1px solid var(--line);align-self:flex-start;border-radius:12px 12px 12px 0;padding:12px 16px;max-width:85%;font-size:15px;line-height:1.4;}
  .msg-tip { font-size: 12px; color: var(--muted); opacity: 0.8; margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .rp-chat { max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; display:flex; flex-direction:column; gap:16px; }
  .rp-chat::-webkit-scrollbar{width:6px;}
  .fav-remove-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;}

  @media (max-width:520px){
    .brand{font-size:14px;}
    .trigger-btn{font-size:13px;min-height:38px;padding:0 6px;}
    .wrap{
      padding-top:28px;padding-bottom:calc(64px + env(safe-area-inset-bottom));
      padding-left:calc(14px + env(safe-area-inset-left));
      padding-right:calc(14px + env(safe-area-inset-right));
    }
    .card{padding:22px 16px;}
    .target-zh{font-size:14px; margin-bottom:16px;}
    .rung{font-size:12px;padding:10px 4px;}
    .app-tab{ min-height: 52px; }
    .tab-icon{ font-size: 18px; }
    .tab-label{ font-size: 9.5px; }
    .btn-mic{width:76px;height:76px;font-size:32px;}
    .controls{gap:14px;}
  }

  @media (max-width:360px){
    .app-tab{ min-height: 48px; }
    .tab-icon{ font-size: 16px; }
    .tab-label{ font-size: 9px; }
    .trigger-btn{font-size:11.5px;padding:0 4px;}
  }
</style>
</head>
<body>
<script src="word_bank.js?v=2"></script>

<div class="wrap">

  <div class="topbar">
    <div class="brand">🗣️ Speak Up</div>
    <div class="triple-bar">
      <button type="button" class="trigger-btn" id="modeTrigger">
        <span id="modeTriggerText">📚 系統題庫</span><span class="trigger-caret">▾</span>
      </button>
      <button type="button" class="trigger-btn" id="stageTrigger">
        <span id="stageTriggerText">單字</span><span class="trigger-caret">▾</span>
      </button>
      <button type="button" class="trigger-btn" id="catTrigger">
        <span id="catTriggerText">全部</span><span class="trigger-caret">▾</span>
      </button>
    </div>
  </div>

  <div class="dropdown-panel" id="modeDropdown">
    <nav class="app-tabs">
      <button class="app-tab active" id="tabGeneral"><span class="tab-icon">📚</span><span class="tab-label">系統題庫</span></button>
      <button class="app-tab" id="tabAI"><span class="tab-icon">✨</span><span class="tab-label">AI 情境</span></button>
      <button class="app-tab" id="tabRoleplay"><span class="tab-icon">💬</span><span class="tab-label">實戰對話</span></button>
      <button class="app-tab" id="tabFavorites"><span class="tab-icon">⭐</span><span class="tab-label">收藏</span></button>
      <button class="app-tab" id="tabReview"><span class="tab-icon">✅</span><span class="tab-label">已完成</span></button>
    </nav>
  </div>
  <div class="dropdown-panel" id="stageDropdown">
    <div class="ladder" id="ladder"></div>
    <div class="stage-desc" id="stageDesc"></div>
  </div>
  <div class="dropdown-panel" id="catDropdown">
    <div class="cats" id="cats"></div>
  </div>

  <div class="ai-actions" id="aiActions" style="display:none;">
    <button class="ai-create-btn" id="openAiModalBtn">🚀 ＋ 請 AI 生成新情境...</button>
  </div>

  <div class="roleplay-container card" id="rpContainer" style="display:none; padding: 24px;">
    <div class="rp-setup" id="rpSetup">
      <div style="font-size:14px; margin-bottom:12px; color:var(--muted);">輸入你想練習的對話情境，AI 會開啟話題與你進行語音對談。</div>
      <div style="display:flex; gap:8px; margin-bottom: 16px;">
        <input type="text" id="rpScenarioInput" placeholder="例如：在速食店點餐" style="flex:1; border: 1px solid var(--line); padding:10px; border-radius: 8px; font-family: 'Inter';">
        <button id="rpRandomBtn" style="background:#f1f5f9; border:1px solid var(--line); padding:0 14px; border-radius:8px; cursor:pointer; color:var(--ink);" title="隨機情境">🎲 隨機</button>
      </div>
      <button id="rpStartBtn" style="background:var(--sage); border:none; padding: 12px; border-radius: 8px; color:white; cursor:pointer; width:100%; font-weight: bold; font-size: 14px;">開啟對話</button>
    </div>
    
    <div class="rp-chat" id="rpChat" style="display:none; flex-direction:column; gap:16px;">
      <!-- Chat messages -->
    </div>
    
    <div class="rp-controls" id="rpControls" style="display:none; margin-top:20px; border-top:1px solid var(--line); padding-top:20px; text-align:center;">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;">
        <button id="rpRestartBtn" style="background:transparent; border:1px solid var(--line); color:var(--muted); padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px;">↺ 重啟對話</button>
        <div id="rpStatus" style="font-size:13px; color:var(--muted); text-align:right;">請按下麥克風開始說話</div>
      </div>
      <button class="btn-mic" id="rpRecBtn" style="margin:0 auto;">🎙</button>
    </div>
  </div>

  <div class="review-container" id="favoritesContainer" style="display:none;"></div>
  <div class="review-container" id="reviewContainer" style="display:none;"></div>

  <div id="unsupported" class="no-support" style="display:none;">

<script>
const el = id => document.getElementById(id);

/* ---------- 頂部三顆選單按鈕：各自獨立展開/收合 ---------- */
const DROPDOWNS = {
  mode:  { panel: 'modeDropdown',  trigger: 'modeTrigger'  },
  stage: { panel: 'stageDropdown', trigger: 'stageTrigger' },
  cat:   { panel: 'catDropdown',   trigger: 'catTrigger'   }
};

function closeDropdown(name){
  const d = DROPDOWNS[name];
  el(d.panel).classList.remove('open');
  el(d.trigger).classList.remove('open');
}
function toggleDropdown(name){
  const wasOpen = el(DROPDOWNS[name].panel).classList.contains('open');
  Object.keys(DROPDOWNS).forEach(closeDropdown);
  if(!wasOpen){
    el(DROPDOWNS[name].panel).classList.add('open');
    el(DROPDOWNS[name].trigger).classList.add('open');
  }
}
el('modeTrigger').onclick = () => toggleDropdown('mode');
el('stageTrigger').onclick = () => toggleDropdown('stage');
el('catTrigger').onclick = () => toggleDropdown('cat');

// 選了模式/階段/分類之後，短暫停留讓使用者看到選取狀態，再自動收合該面板
el('modeDropdown').addEventListener('click', (e) => {
  if(e.target.closest('.app-tab')) setTimeout(() => closeDropdown('mode'), 150);
});
el('stageDropdown').addEventListener('click', (e) => {
  if(e.target.closest('.rung')) setTimeout(() => closeDropdown('stage'), 150);
});
el('catDropdown').addEventListener('click', (e) => {
  if(e.target.closest('.cat-pill')) setTimeout(() => closeDropdown('cat'), 150);
});

function updateTriggerTexts(){
  const modeLabels = { general:'📚 系統題庫', ai:'✨ AI情境', roleplay:'💬 實戰對話', favorites:'⭐ 收藏', review:'✅ 已完成' };
  el('modeTriggerText').textContent = modeLabels[appMode] || '📚 系統題庫';

  const showStageAndCat = (appMode === 'general' || appMode === 'ai');
  el('stageTrigger').style.display = showStageAndCat ? 'flex' : 'none';
  el('catTrigger').style.display = showStageAndCat ? 'flex' : 'none';
  if(!showStageAndCat){
    closeDropdown('stage');
    closeDropdown('cat');
  }

  if(showStageAndCat){
    const stage = (typeof currentStage === 'function') ? currentStage() : null;
    if(stage) el('stageTriggerText').textContent = stage.label;

    if(typeof activeCat !== 'undefined' && activeCat && activeCat !== 'all'){
      const catDisplay = activeCat.startsWith('(AI) ') ? activeCat.replace('(AI) ','✨ ') : activeCat;
      el('catTriggerText').textContent = catDisplay;
    } else {
      el('catTriggerText').textContent = '全部';
    }
  }
}

/* ---------- 收藏與初始化 ---------- */
let favorites = [];
try {
  const f = localStorage.getItem('speakup_favorites');
  if(f) favorites = JSON.parse(f);
} catch(e){}

function saveFavorites() {
  localStorage.setItem('speakup_favorites', JSON.stringify(favorites));
}

/* ---------- 已完成題目記錄(記憶功能) ---------- */
let practiced = {};
try {
  const p = localStorage.getItem('speakup_practiced');
  if(p) practiced = JSON.parse(p);
} catch(e){}

function savePracticed() {
  localStorage.setItem('speakup_practiced', JSON.stringify(practiced));
}

function recordPracticed(item, stageIdx){
  if(!item || !item.en) return;
  practiced[item.en] = {
    en: item.en,
    zh: item.zh || '',
    cat: item.cat || '未分類',
    stage: stageIdx
  };
  savePracticed();
}

const STAGES = [
  {
    key:'word', label:'單字', desc:'看到單字，念出聲就好——不用完美，只要開口。',
    items:[

      {en:'internship', zh:'實習', cat:'面試'},

      {en:'deadline', zh:'截止日期', cat:'開會'},
      {en:'collaborate', zh:'合作', cat:'開會'},
      {en:'update', zh:'進度更新', cat:'開會'},
      {en:'feedback', zh:'回饋、意見', cat:'開會'},

      {en:'industry', zh:'產業', cat:'社交'},
      {en:'network', zh:'建立人脈', cat:'社交'},
      {en:'appreciate', zh:'感激', cat:'社交'},
      {en:'colleague', zh:'同事', cat:'社交'}
    ]
  },
  {
    key:'phrase', label:'片語', desc:'兩三個字一組，開始練習講話的節奏感。',
    items:[
      {en:'apply for a position', zh:'應徵一個職缺', cat:'面試'},
      {en:'a good fit for', zh:'很適合...', cat:'面試'},
      {en:'work under pressure', zh:'在壓力下工作', cat:'面試'},
      {en:'take the initiative', zh:'主動採取行動', cat:'面試'},
      {en:'strengths and weaknesses', zh:'優點與缺點', cat:'面試'},
      {en:'be responsible for', zh:'負責...', cat:'開會'},

  {

      {en:"Can you tell me more about the team I'd be working with?", zh:'可以多說一些我會加入的團隊嗎？', cat:'面試'},

      {en:"I'm not sure, let me check and get back to you.", zh:'我不確定，讓我確認後回覆你。', cat:'開會'},
      {en:"Could you clarify what the timeline looks like?", zh:'可以請你說明一下時程大概是怎樣嗎？', cat:'開會'},
      {en:"I'd like to walk you through my results.", zh:'我想跟你說明一下我的研究結果。', cat:'學術'},
      {en:"My research focuses on how X affects Y.", zh:'我的研究聚焦在X如何影響Y。', cat:'學術'},
      {en:"That's a great question, let me think about it.", zh:'這是個好問題，讓我想一下。', cat:'學術'},
      {en:"So, what brings you to this event?", zh:'那，是什麼讓你來參加這個活動的呢？', cat:'社交'},
      {en:"Thanks for your time, it was great talking to you.", zh:'謝謝你的時間，很高興跟你聊天。', cat:'社交'}
    ]
  },
  {
    key:'free', label:'自由回答', desc:'看到情境，自己講一句——沒有標準答案，講出來就是贏。',
    items:[
      {en:"Introduce yourself in 30 seconds, as if in a job interview.", zh:'用30秒自我介紹，想像是在面試場合。', cat:'面試'},
      {en:"Tell me why you're interested in this industry.", zh:'說說你為什麼對這個產業有興趣。', cat:'面試'},
      {en:"Describe a challenge you faced and how you handled it.", zh:'描述一個你遇到的挑戰，還有你怎麼處理的。', cat:'面試'},
      {en:"Explain a time you worked in a team.", zh:'描述一次你在團隊中合作的經驗。', cat:'開會'},
      {en:"Give a 1-minute status update on a made-up project.", zh:'假裝有個專案，做一分鐘的進度報告。', cat:'開會'},
      {en:"Explain your thesis topic to someone outside your field.", zh:'跟一個非本科系的人解釋你的論文主題。', cat:'學術'},
      {en:"Describe a challenge you faced during your research.", zh:'描述你在研究過程中遇到的一個挑戰。', cat:'學術'},
      {en:"Introduce yourself at a networking event.", zh:'想像在一場社交活動中自我介紹。', cat:'社交'}
    ]
  },
  { key:'favorites', label:'⭐ 收藏', desc:'你收藏的重點，隨時複習。', items: favorites }
];

/* ---------- 本地儲存進度記憶 ---------- */
let savedStageIdx = localStorage.getItem('speakup_stageIdx');
let savedCat = localStorage.getItem('speakup_cat');
let savedCatProgressStr = localStorage.getItem('speakup_cat_progress');
let catProgress = savedCatProgressStr ? JSON.parse(savedCatProgressStr) : {};
let geminiApiKey = localStorage.getItem('speakup_apikey') || '';
const VALID_MODES = ['general', 'ai', 'roleplay', 'favorites', 'review'];
const savedMode = localStorage.getItem('speakup_appMode');
let appMode = (savedMode && VALID_MODES.includes(savedMode)) ? savedMode : 'general';

function getSavedItemIdx(sIdx, cat) {
  const key = `${sIdx}_${cat}`;
  return catProgress[key] || 0;
}

let stageIdx = savedStageIdx ? parseInt(savedStageIdx, 10) : 0;
let activeCat = savedCat || 'all';
let itemIdx = getSavedItemIdx(stageIdx, activeCat);

function saveProgress(){
  localStorage.setItem('speakup_stageIdx', stageIdx);
  localStorage.setItem('speakup_cat', activeCat);
  const key = `${stageIdx}_${activeCat}`;
  catProgress[key] = itemIdx;
  localStorage.setItem('speakup_cat_progress', JSON.stringify(catProgress));
}

function setAppMode(mode, isInitial = false) {
  appMode = mode;
  localStorage.setItem('speakup_appMode', appMode);
  
  el('tabGeneral').classList.toggle('active', mode === 'general');
  el('tabAI').classList.toggle('active', mode === 'ai');
  if(el('tabRoleplay')) el('tabRoleplay').classList.toggle('active', mode === 'roleplay');
  if(el('tabFavorites')) el('tabFavorites').classList.toggle('active', mode === 'favorites');
  if(el('tabReview')) el('tabReview').classList.toggle('active', mode === 'review');
  
  const isSpecialMode = (mode === 'roleplay' || mode === 'review' || mode === 'favorites');
  
  el('aiActions').style.display = mode === 'ai' ? 'block' : 'none';
  el('ladder').style.display = (mode === 'general') ? 'flex' : 'none';
  el('stageDesc').style.display = (mode === 'general') ? 'block' : 'none';
  el('cats').style.display = isSpecialMode ? 'none' : 'flex';
  
  if(el('mainCard')) el('mainCard').style.display = isSpecialMode ? 'none' : 'block';
  if(el('rpContainer')) el('rpContainer').style.display = (mode === 'roleplay') ? 'block' : 'none';
  if(el('favoritesContainer')) el('favoritesContainer').style.display = (mode === 'favorites') ? 'block' : 'none';
  if(el('reviewContainer')) el('reviewContainer').style.display = (mode === 'review') ? 'block' : 'none';
  
  const addPanel = document.querySelector('.add-panel');
  if(addPanel) addPanel.style.display = isSpecialMode ? 'none' : 'block';
  
  const quickNav = el('quickNav');
  if(quickNav) quickNav.style.display = isSpecialMode ? 'none' : 'flex';
  
  if(!isInitial && !isSpecialMode) {
    activeCat = 'all';
    itemIdx = getSavedItemIdx(stageIdx, activeCat);
    saveProgress();
  }
  if(mode === 'review') renderReview();
  if(mode === 'favorites') renderFavorites();
  render();
  updateTriggerTexts();
}

el('tabGeneral').onclick = () => setAppMode('general');
el('tabAI').onclick = () => setAppMode('ai');
el('tabRoleplay').onclick = () => setAppMode('roleplay');
el('tabFavorites').onclick = () => setAppMode('favorites');
el('tabReview').onclick = () => setAppMode('review');

/* ---------- 已完成清單畫面 ---------- */
function jumpToItem(en){
  for(let i=0;i<STAGES.length;i++){
    if(STAGES[i].key === 'favorites') continue; // skip the favorites pseudo-stage
    const idx = STAGES[i].items.findIndex(x => x.en === en);
    if(idx !== -1){
      stageIdx = i;
      activeCat = 'all';
      itemIdx = idx;
      saveProgress();
      setAppMode('general');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
  }
}

function renderReview(){
  const container = el('reviewContainer');
  const list = Object.values(practiced);
  if(list.length === 0){
    container.innerHTML = '<div class="review-empty">還沒有練習紀錄。<br>回「系統題庫」開口練習,講過的題目會自動出現在這裡。</div>';
    return;
  }

  const groups = {};
  list.forEach(it => {
    const cat = it.cat || '未分類';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(it);
  });

  const sortedCats = Object.keys(groups).sort();
  let html = '';
  sortedCats.forEach(cat => {
    const items = groups[cat];
    html += `<details class="review-group">
      <summary><div class="review-group-title-left"><span>${cat}</span></div><span class="review-group-count">${items.length} 題</span></summary>
      <div class="review-group-items">`;
    items.forEach(it => {
      html += `<div class="review-item" data-en="${it.en.replace(/"/g,'&quot;')}">
        <div>
          <div class="review-item-en">${it.en}</div>
          ${it.zh ? `<div class="review-item-zh">${it.zh}</div>` : ''}
        </div>
        <div style="color:var(--muted);">→</div>
      </div>`;
    });
    html += `</div></details>`;
  });
  container.innerHTML = html;

  container.querySelectorAll('.review-item').forEach(row => {
    row.onclick = () => jumpToItem(row.getAttribute('data-en'));
  });
}

function renderFavorites(){
  const container = el('favoritesContainer');
  if(favorites.length === 0){
    container.innerHTML = '<div class="review-empty">⭐ 還沒有收藏。<br>在練習卷片右上角點 <strong>☆</strong> 可以將題目加入收藏。</div>';
    return;
  }

  const groups = {};
  favorites.forEach(it => {
    const cat = it.cat || '未分類';
    const displayCat = cat.startsWith('(AI) ') ? cat.replace('(AI) ','✨ ') : cat;
    if(!groups[displayCat]) groups[displayCat] = [];
    groups[displayCat].push(it);
  });

  const sortedCats = Object.keys(groups).sort();
  let html = '<div style="margin-bottom:14px;font-size:13px;color:var(--muted);">\u9ede项目可回到練習，點⭐可取消收藏。</div>';
  sortedCats.forEach(cat => {
    const items = groups[cat];
    html += `<div class="review-group">
      <div class="review-group-title"><span>${cat}</span><span class="review-group-count">${items.length} \u984c</span></div>`;
    items.forEach(it => {
      html += `<div class="review-item" data-en="${it.en.replace(/"/g,'&quot;')}">
        <div style="flex:1;min-width:0;">
          <div class="review-item-en">${it.en}</div>
          ${it.zh ? `<div class="review-item-zh">${it.zh}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <button class="fav-remove-btn" data-en="${it.en.replace(/"/g,'&quot;')}" title="\u53d6消收藏" style="background:none;border:none;cursor:pointer;font-size:20px;padding:6px;line-height:1;min-width:36px;min-height:36px;">⭐</button>
          <span style="color:var(--muted);font-size:14px;">→</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html;

  container.querySelectorAll('.review-item').forEach(row => {
    row.onclick = (e) => {
      if(e.target.closest('.fav-remove-btn')) return;
      jumpToItem(row.getAttribute('data-en'));
    };
  });

  container.querySelectorAll('.fav-remove-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const en = btn.getAttribute('data-en');

const DICT_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';

let recognition = null;
let isRecording = false;
let accentPref = 'us';

/* ---------- 字典 API 串接 (Free Dictionary API) ---------- */

async function fetchWordData(word){
  const clean = word.toLowerCase().trim();
  const url = DICT_API + encodeURIComponent(clean);
  const res = await fetch(url);
  if(!res.ok) throw new Error('查詢失敗 (' + res.status + ')');
  const data = await res.json();
  if(!Array.isArray(data) || !data.length) throw new Error('無資料');
  const entry = data[0];
  // 擷取音標與音檔
  const variants = {};
  const phonetics = entry.phonetics || [];
  // 全局音標
  const globalPhon = entry.phonetic || '';
  phonetics.forEach(p => {
    if(!p.audio) return;
    const audioUrl = p.audio;
    const isUS = audioUrl.includes('-us') || audioUrl.includes('_us');
    const isUK = audioUrl.includes('-uk') || audioUrl.includes('_uk');
    const key = isUS ? 'us' : isUK ? 'uk' : null;
    if(key && !variants[key]){
      variants[key] = { audio: audioUrl, phon: p.text || globalPhon };
    }
  });
  // 如果只有一個音檔但沒被分類
  if(!variants.us && !variants.uk && phonetics.length > 0){
    const p = phonetics.find(x => x.audio) || phonetics[0];
    variants.us = { audio: p.audio || '', phon: p.text || globalPhon };
  }
  // 如果連音檔都沒有，至少給音標
  if(!variants.us && !variants.uk && globalPhon){
    variants.us = { audio: '', phon: globalPhon };
  }
  return { zh: null, variants };
}

function getVariant(item){
  if(!item || !item.variants) return null;
  return item.variants[accentPref] || item.variants.us || item.variants.uk || null;
}

/* ---------- 用 Gemini 自動翻譯中文(當使用者沒填中文時) ---------- */
async function fetchZhViaGemini(text){
  if(!geminiApiKey) return '';
  const prompt = `請給出英文「${text}」最常用、最自然的繁體中文(台灣)翻譯。只要輸出翻譯本身,不要加任何解釋、標點或多餘文字,控制在12個字以內。`;
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] })
    });
    if(!res.ok) return '';
    const data = await res.json();
    const text2 = data.candidates?.[0]?.content?.parts?.[0]?.text;
    return text2 ? text2.trim().replace(/^["「]|["」]$/g, '') : '';
  }catch(e){
    return '';
  }
}

// 背景查詢單字資料（音檔、音標），完成後如果還在看同一題就重繪
function fetchAndEnrich(item){
  if(item._fetching || item._fetched) return;
  item._fetching = true;
  fetchWordData(item.en).then(data => {
    item.variants = data.variants;
    item._fetched = true;
  }).catch(() => {
    item._fetched = true;
  }).finally(() => {
    item._fetching = false;
    if(currentItem() === item) render();
  });
}

// 把 IPA/KK 音標符號轉換成看得懂的英文字母拼法（近似值，幫助抓感覺，不是精確音標）
// IPA → 白話英文拼法對照表（讓台灣人直覺讀出英文發音）
const IPA_TO_PLAIN = [
  // 子音組合（優先處理，避免被單音節拆散）
  ['tʃ','ch'], ['dʒ','j'],
  // 雙母音（Diphthongs）
  ['eɪ','ay'], ['aɪ','ai'], ['ɔɪ','oy'], ['aʊ','ow'], ['oʊ','oh'],
  // R音化母音
  ['ɜːr','er'], ['ɜː','er'], ['ɝ','er'], ['ər','er'], ['ɚ','er'],
  ['ɔːr','or'], ['ɑːr','ar'],
  // 長母音
  ['ɔː','aw'], ['ɑː','ah'], ['iː','ee'], ['uː','oo'],
  // 特殊子音
  ['ʃ','sh'], ['ʒ','zh'], ['θ','th'], ['ð','th'], ['ŋ','ng'],
  // 短母音（schwa ə 放最後，因為它很常見且不能覆蓋其他音）
  ['ɪ','i'],   // bit → bit
  ['ɛ','e'],   // bed → bed
  ['æ','a'],   // cat → cat
  ['ɒ','ah'],  // lot → laht（英式）
  ['ʌ','u'],   // cup → cup（比 uh 更直覺）
  ['ʊ','oo'],  // book → book（短oo）
  ['ə','uh'],  // schwa，輕讀音節
  // 其他符號標準化
  ['ɹ','r'], ['ɡ','g'], ['j','y'],
  ['x','k'],   // loch → lock
  ['ʔ',''],    // 喉塞音，略去
];

function ipaToPlain(syl){
  let s = syl;
  IPA_TO_PLAIN.forEach(([ipa, plain]) => { s = s.split(ipa).join(plain); });
  return s.replace(/[ːˑ]/g, '');
}

// 把音標字串拆成音節，轉換成白話拼音，並把重音節放大加粗
function renderPhonetics(phon){
  const block = el('phonBlock');
  const visual = el('phonVisual');
  const rawRow = el('phonRawRow');
  if(!phon){ block.style.display = 'none'; visual.innerHTML = ''; if(rawRow) rawRow.textContent = ''; return; }
  block.style.display = 'block';
  const clean = phon.replace(/^\/|\/$/g,'').trim().replace(/ɹ/g, 'r').replace(/ɡ/g, 'g');

  // 確保重音符號和句點都可以作為音節分隔
  let marked = clean.replace(/([ˈˌ])/g, '.$1');
  marked = marked.replace(/\.+/g, '.');
  marked = marked.replace(/^\./, '');

  const parts = marked.split('.').filter(Boolean);

  const syllables = parts.map(syl => ({
    raw: syl.replace(/[ˈˌ]/g,''),
    stressed: syl.includes('ˈ'),
    secondary: syl.includes('ˌ')
  }));

  visual.innerHTML = syllables.map(s => {
    const cls = s.stressed ? ' stressed' : (s.secondary ? ' secondary' : '');
    const plain = ipaToPlain(s.raw) || s.raw;
    return '<span class="syl' + cls + '">' + plain + '</span>';
  }).join('<span class="dot">-</span>');

  if(rawRow) rawRow.textContent = '音標參考：/' + clean + '/';
}

function speak(text){

}

// 播放發音：改為全面使用瀏覽器內建 TTS (speechSynthesis)
// 原因：1. 無雜音 (Free Dictionary 的 MP3 常有嚴重底噪)
//       2. 同步執行 (iOS Safari 嚴格禁止非同步或 Promise catch 內的語音合成，導致先前音檔失效時連備援 TTS 都播不出來)
function playAudio(item, rate = 0.9){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); // 中斷現有音訊
  const u = new SpeechSynthesisUtterance(item.en);
  u.lang = accentPref === 'uk' ? 'en-GB' : 'en-US';
  u.rate = rate;
  speechSynthesis.speak(u);
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function normalize(s){
  return s.toLowerCase().replace(/[^\w\s']/g,'').trim();
}

function showResult(heardText){
  const item = currentItem();
  const isFree = currentStage().key === 'free';
  el('heard').textContent = heardText || '(沒聽到聲音)';
  el('result').classList.add('show');
  const fb = el('feedback');

  if(heardText){
    recordPracticed(item, stageIdx);
  }

  if(isFree){
    fb.className = 'feedback';
    fb.textContent = heardText ? '你講出來了——這就是重點,內容不用完美。' : '再試一次,講出你想到的任何一句話就好。';
    return;
  }

  if(!heardText){
    fb.className = 'feedback retry';
    fb.textContent = '沒聽清楚，請再試一次。';
    el('coachBtn').style.display = 'none';
    return;
  }

  const a = normalize(heardText);
  const b = normalize(item.en);
  const dist = levenshtein(a, b);
  const closeness = 1 - dist / Math.max(a.length, b.length, 1);

  if(closeness > 0.85){
    fb.className = 'feedback';
    fb.textContent = '非常棒，完全正確！';
    el('coachBtn').style.display = 'none';
  } else if(closeness > 0.5){
    fb.className = 'feedback retry';
    fb.textContent = '抓到重點了，稍微有點差異，可以再聽一次看看。';
    el('coachBtn').style.display = 'inline-block';
  } else {
    fb.className = 'feedback retry';
    fb.textContent = '差異較大，別灰心，慢慢念再試一次。';
    el('coachBtn').style.display = 'inline-block';
  }
}

let SRClass = null;
let finalTranscript = '';
let gotResult = false;
let recStartTime = 0;
let recTimeoutTimer = null;
let micReady = false;

/* ---------- 麥克風預熱 ---------- */
async function warmUpMic(){
  if(micReady) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    micReady = true;
  }catch(e){
    // 權限被拒或不支援,後續 SpeechRecognition 會處理
  }
}

function setupRecognition(){
  SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SRClass){
    el('unsupported').style.display = 'block';
    el('recBtn').disabled = true;
    return;
  }
}

function buildRecognition(){
  const r = new SRClass();
  r.lang = 'en-US';
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;

  r.onresult = (e) => {
    // 關鍵修正：iOS Safari 不一定送出 isFinal=true
    // 因此持續儲存最新 transcript，不論 isFinal 狀態
    let interim = '';
    let final = '';
    for(let i = 0; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += t;
      else interim += t;
    }
    // 優先用 final，沒有就用 interim
    finalTranscript = final || interim;
    // 只要有任何內容就算有結果
    if(finalTranscript) gotResult = true;
    // 即時顯示辨識文字
    el('liveTranscript').textContent = finalTranscript ? '聽到: ' + finalTranscript : '';
    // 收到結果就重置超時
    resetRecTimeout();
  };

  r.onspeechstart = () => {
    // 偵測到說話聲,重置超時
    resetRecTimeout();
  };

  r.onerror = (e) => {
    clearTimeout(recTimeoutTimer);
    const messages = {
      'not-allowed':'麥克風權限被拒絕,請到設定 > Safari > 麥克風開啟權限。',
      'no-speech':'沒偵測到說話聲,請靠近麥克風再試一次。',
      'audio-capture':'抓不到麥克風,請確認沒有其他 App 正在使用麥克風。',
      'network':'網路連線問題,語音辨識需要網路連線。',
      'aborted':''
    };
    const msg = messages[e.error];
    if(msg){
      // 標記已有結果以防 onend 重複處理
      gotResult = true;
      finalTranscript = '';
      showErrorMsg(msg);
    }
  };

  r.onend = () => {
    clearTimeout(recTimeoutTimer);
    isRecording = false;
    el('recBtn').innerHTML = '🎙';
    el('recBtn').classList.remove('recording');
    el('liveTranscript').textContent = '';
    // 關鍵修正：只要 finalTranscript 有內容就視為成功
    if(finalTranscript){
      showResult(finalTranscript);
    } else if(!gotResult){
      // 真的完全沒收到任何東西
      showErrorMsg('沒有聽到聲音。請確認麥克風正常,點擊錄音後立刻開口說話。');
    }
    // 如果 gotResult=true 但 finalTranscript='' → onerror 已經處理過了,不重複顯示
  };
  return r;
}

function resetRecTimeout(){
  clearTimeout(recTimeoutTimer);
  // 8 秒無新結果就自動停止
  recTimeoutTimer = setTimeout(() => {
    if(isRecording && recognition){
      try{ recognition.stop(); }catch(e){}
    }
  }, 8000);
}

function showErrorMsg(msg){
  el('heard').textContent = '';
  el('result').classList.add('show');
  const fb = el('feedback');
  fb.className = 'feedback retry';
  fb.textContent = msg;
}

/* ---------- 錄音：點擊切換模式 ---------- */
const MIN_REC_MS = 1500; // 最小錄音時間,防止太快 stop

function startRecording(){
  if(!SRClass) return;
  warmUpMic();
  speechSynthesis.cancel();
  isRecording = true;
  gotResult = false;
  finalTranscript = '';
  recStartTime = Date.now();
  el('recBtn').classList.add('recording');
  el('liveTranscript').textContent = '正在聆聽...';
  el('result').classList.remove('show');
  recognition = buildRecognition();
  try{ recognition.start(); }catch(e){
    isRecording = false;
    el('recBtn').innerHTML = '🎙';
    el('recBtn').classList.remove('recording');
    el('liveTranscript').textContent = '';
    showErrorMsg('無法啟動麥克風，重新整理頁面後再試一次。');
  }
  // 啟動超時保護
  resetRecTimeout();
}

function stopRecording(){
  if(!isRecording) return;
  // 確保至少錄 MIN_REC_MS 毫秒
  const elapsed = Date.now() - recStartTime;
  if(elapsed < MIN_REC_MS){
    setTimeout(() => {
      if(isRecording && recognition){
        try{ recognition.stop(); }catch(e){}
      }
    }, MIN_REC_MS - elapsed);
  } else {
    if(recognition) try{ recognition.stop(); }catch(e){}
  }
}

el('aiGenerateBtn').onclick = async () => {
  const scenario = el('aiScenarioInput').value.trim();
  if(!geminiApiKey){ el('aiStatus').textContent = '⚠️ 請先輸入 Gemini API Key'; return; }
  if(!scenario){ el('aiStatus').textContent = '⚠️ 請輸入你想練習的情境'; return; }
  
  const btn = el('aiGenerateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中，請稍候... (約需 5~10 秒)';
  el('aiStatus').textContent = '';

  const prompt = `你是一個專業的英文老師。請根據情境：「${scenario}」，生成相關的英文練習題目。
請嚴格輸出 JSON 陣列，包含 10 個單字、5 個片語、5 個句子。每個物件必須有 en, zh, cat 三個屬性。cat 必須固定填入 "(AI) ${scenario}"。
zh (中文) 必須是繁體中文(台灣)。
格式範例：
[
  {"en":"passport", "zh":"護照", "cat":"(AI) ${scenario}"},
  {"en":"check in", "zh":"報到", "cat":"(AI) ${scenario}"},
  {"en":"Where is the boarding gate?", "zh":"登機門在哪裡？", "cat":"(AI) ${scenario}"}
]
不要輸出任何 Markdown 語法（例如 \`\`\`json ），只要純 JSON 文字陣列即可。`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey},
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{text: prompt}] }],
        generationConfig: { responseMimeType: "application/json" }
      })
    });

    if(!res.ok) {
      let errText = '';
      try {
        const errJson = await res.json();
        errText = errJson.error?.message || res.statusText;
      } catch(e) {
        errText = res.statusText;
      }
      if(res.status === 429) throw new Error('今日 AI 額度已用完(429),明天太平洋時間午夜後(約台灣下午3點)重置。');
      throw new Error(`API 請求失敗 (${res.status}): ${errText}`);
    }
    
    const data = await res.json();
    let resultText = data.candidates[0].content.parts[0].text;
    resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
    const items = JSON.parse(resultText);
    
    const catName = `(AI) ${scenario}`;
    items.forEach(it => {
      if(!it.en) return;
      const wordCount = it.en.trim().split(/\s+/).length;
      let targetKey = 'word';
      if(wordCount > 3 || it.en.includes('?')) targetKey = 'sentence';
      else if(wordCount > 1) targetKey = 'phrase';
      
      const stage = STAGES.find(s => s.key === targetKey);
      if(stage) {
        const newItem = { en: it.en, zh: it.zh, cat: catName, _type: targetKey };
        stage.items.push(newItem);
        aiGeneratedItems.push(newItem);
        if(WORD_BANK[targetKey]) {
          WORD_BANK[targetKey].push(newItem);
        }
      }
    });
    
    localStorage.setItem('speakup_ai_items', JSON.stringify(aiGeneratedItems));
    
    el('aiStatus').textContent = '✅ 生成成功！已幫你切換到新類別。';
    setTimeout(() => {
      el('aiModal').classList.remove('show');
    }, 1500);
    
    activeCat = catName;
    itemIdx = 0;
    saveProgress();
    render();
    
  } catch(err) {
    el('aiStatus').textContent = '❌ 生成失敗：' + err.message;
  }
  
  btn.disabled = false;
  btn.textContent = '🚀 立即生成題目';
};

async function fetchRpResponse(contents) {
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
      body: JSON.stringify({
        contents: contents,
        generationConfig: { responseMimeType: "application/json" }
      })
    });

    if(!res.ok){
      let detail = res.statusText;
      try{
        const errJson = await res.json();
        detail = errJson.error?.message || detail;
      }catch(e){}
      if(res.status === 400) throw new Error('請求格式錯誤或 API Key 無效(400):' + detail);
      if(res.status === 403) throw new Error('API Key 沒有權限或被拒絕(403):' + detail);
      if(res.status === 404) throw new Error('找不到這個模型(404),可能模型名稱已變更:' + detail);
      if(res.status === 429) throw new Error('已達使用額度上限,請稍後再試(429):' + detail);
      throw new Error('API 請求失敗(' + res.status + '):' + detail);
    }

    const data = await res.json();
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('AI 回傳內容為空,可能是被安全機制擋下或觸發了長度上限。');

    // Clean up potential markdown formatting from JSON
    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      throw new Error('AI 回傳的內容不是有效 JSON,可能是模型格式跑掉了。原始內容:' + text.slice(0, 80));
    }
    
    // Add AI message to history
    rpHistory.push(contents[contents.length-1]); 
    rpHistory.push({role: "model", parts: [{text: text}]});
    
    // UI update
    const div = document.createElement('div');
    div.className = 'msg-ai';
    div.innerHTML = `<strong>AI:</strong> ${parsed.next_response_en}<div style="font-size:12px;opacity:0.7;margin-top:4px;">${parsed.next_response_zh}</div>`;
    if(parsed.feedback) {
      div.innerHTML += `<div class="msg-tip">💡 教練提示：${parsed.feedback}</div>`;
    }
    el('rpChat').appendChild(div);
    
    // Auto scroll
    el('rpChat').scrollTop = el('rpChat').scrollHeight;
    
    // Play audio
    const u = new SpeechSynthesisUtterance(parsed.next_response_en);
    u.lang = accentPref === 'uk' ? 'en-GB' : 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
    
    el('rpStatus').textContent = '請按下麥克風開始說話';
  } catch(e) {
    console.error('Roleplay API error:', e);
    el('rpStatus').textContent = '⚠️ ' + e.message;
  }
}

function initRpSR() {
  if(!SRClass) return;
  rpSR = new SRClass();
  rpSR.lang = 'en-US';
  rpSR.continuous = false;
  rpSR.interimResults = false;
  
  rpSR.onstart = () => {
    rpIsRecording = true;
    el('rpRecBtn').classList.add('recording');
    el('rpStatus').textContent = '聆聽中... (請說話)';
  };
  
  rpSR.onresult = async (e) => {
    const heard = e.results[0][0].transcript;
    if(!heard) return;
    
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.innerHTML = `<strong>你:</strong> ${heard}`;
    el('rpChat').appendChild(div);
    el('rpChat').scrollTop = el('rpChat').scrollHeight;
    
    el('rpStatus').textContent = 'AI 思考中...';
    
    const prompt = `我說了："${heard}"。請評估這句話是否符合情境與文法，給予簡單的繁體中文回饋(feedback)，並順著對話繼續回覆我(next_response_en)。請強制回傳 JSON 格式：{"next_response_en": "", "next_response_zh": "", "feedback": "中文提示"}`;
    
    await fetchRpResponse([...rpHistory, {role: "user", parts: [{text: prompt}]}]);
  };
  
  rpSR.onerror = (e) => {
    if(el('rpStatus').textContent !== 'AI 思考中...') {
      el('rpStatus').textContent = '聽不清楚，請再按一次麥克風。';
    }
  };
  
  rpSR.onend = () => {
    rpIsRecording = false;
    el('rpRecBtn').classList.remove('recording');
    if(el('rpStatus').textContent.includes('聆聽中')) {
      el('rpStatus').textContent = '請按下麥克風開始說話';
    }
    // iOS fix: SpeechRecognition instance becomes unusable after onend,
    // must create a new one before next start()
    rpSR = null;
  };
}

el('rpRecBtn').onclick = () => {
  if(!SRClass) { alert('您的瀏覽器不支援語音辨識'); return; }
  if(!rpSR) initRpSR();
  
  if(el('rpStatus').textContent === 'AI 思考中...') return;
  
  if(rpIsRecording && rpSR) {
    try { rpSR.stop(); } catch(e){}
    rpIsRecording = false;
    return;
  }
  
  warmUpMic();
  try {
    rpSR.start();
  } catch(e) {
    console.error(e);
  }
};

  el('rpControls').style.display = 'none';
  el('rpSetup').style.display = 'block';

};
