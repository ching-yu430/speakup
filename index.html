<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>開口練習 Speak Up</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#20261f;
    --paper:#f6f3ea;
    --card:#ffffff;
    --sage:#5c7a5e;
    --sage-dark:#3c5a3e;
    --sage-light:#e4ebe0;
    --clay:#c17a52;
    --clay-light:#f3e2d5;
    --line:#dcd6c4;
    --muted:#8a8577;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 100px;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--sage-dark);font-weight:600;margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:34px;
    margin:0 0 10px;letter-spacing:-.01em;
  }
  .sub{color:var(--muted);font-size:15px;max-width:520px;}

  .ladder{
    display:flex;gap:6px;margin:24px 0 16px;
  }
  .rung{
    flex:1;padding:12px 6px;text-align:center;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
    transition:all .2s;
  }
  .rung.active{
    background:var(--sage);color:#fff;border-color:var(--sage);
  }

  .stage-desc{
    font-size:14px;color:var(--muted);margin-bottom:16px;padding-left:2px;
  }

  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .cat-pill{
    padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:13px;color:var(--muted);cursor:pointer;
    font-weight:500;transition:all .15s;
  }
  .cat-pill.active{background:var(--clay);color:#fff;border-color:var(--clay);}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;margin-bottom:20px;
  }

  .target-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .target-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .target-cat{font-size:12px;color:var(--clay);font-weight:600;}
  .target{
    font-family:'Fraunces',serif;font-size:27px;font-weight:500;
    color:var(--ink);margin-bottom:6px;line-height:1.4;
  }
  .target-zh{color:var(--muted);font-size:15px;margin-bottom:24px;}

  .phon-block{margin:-8px 0 22px;}
  .phon-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .phon-visual{font-family:'Fraunces',serif;font-size:16px;color:var(--muted);letter-spacing:.02em;}
  .phon-visual .syl{transition:all .15s;}
  .phon-visual .syl.stressed{font-size:23px;font-weight:600;color:var(--clay);}
  .phon-visual .dot{color:var(--line);padding:0 2px;}
  .phon-visual .phon-raw{font-size:16px;color:var(--muted);}

  .accent-row{display:flex;gap:6px;margin-bottom:2px;}
  .accent-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    border-radius:999px;border:1px solid var(--line);background:#fff;
    padding:6px 12px;cursor:pointer;color:var(--muted);
    -webkit-user-select:none;user-select:none;
  }
  .accent-btn.active{background:var(--sage-light);color:var(--sage-dark);border-color:var(--sage);}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  button{
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
    border-radius:10px;border:1px solid var(--line);background:#fff;
    padding:13px 18px;cursor:pointer;color:var(--ink);
    display:inline-flex;align-items:center;gap:8px;
    transition:all .15s;-webkit-user-select:none;user-select:none;
  }
  button:hover{border-color:var(--sage);}
  button:active{transform:scale(.97);}
  button.primary{background:var(--sage);color:#fff;border-color:var(--sage);}
  button.primary:hover{background:var(--sage-dark);}
  button.recording{
    background:var(--clay);color:#fff;border-color:var(--clay);
    animation:pulse-rec 1.2s ease-in-out infinite;
  }
  @keyframes pulse-rec{
    0%,100%{box-shadow:0 0 0 0 rgba(193,122,82,.5);}
    50%{box-shadow:0 0 0 12px rgba(193,122,82,0);}
  }
  button:disabled{opacity:.45;cursor:not-allowed;}
  #recBtn{touch-action:none;-webkit-user-select:none;user-select:none;}

  .live-transcript{
    margin-top:10px;font-size:14px;color:var(--muted);font-style:italic;
    min-height:22px;transition:opacity .2s;
  }
  .live-transcript:empty{opacity:0;}
  .live-transcript:not(:empty){opacity:1;}

  .result{
    margin-top:20px;padding-top:20px;border-top:1px solid var(--line);
    display:none;
  }
  .result.show{display:block;}
  .you-said{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .heard{font-size:18px;margin-bottom:14px;}
  .feedback{
    font-size:14px;padding:12px 16px;border-radius:10px;
    background:var(--sage-light);color:var(--sage-dark);
  }
  .feedback.retry{background:var(--clay-light);color:#8a4a26;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:10px;}
  .counter{font-size:13px;color:var(--muted);}
  .skip{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;font-weight:400;}

  details.add-panel{
    margin-top:32px;
  }
  details.add-panel summary{
    cursor:pointer;font-size:14px;color:var(--muted);text-decoration:underline;
    list-style:none;-webkit-user-select:none;user-select:none;
  }
  details.add-panel summary::-webkit-details-marker{display:none;}
  .add-body{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;}
  .add-row input{
    flex:1;min-width:140px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);font-size:14px;font-family:'Inter',sans-serif;
    background:#fff;color:var(--ink);
  }
  .add-row input:focus{outline:none;border-color:var(--sage);}
  .add-row select{
    padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }

  .mobile-note{
    background:var(--sage-light);color:var(--sage-dark);padding:14px 18px;
    border-radius:12px;font-size:13px;margin-bottom:20px;display:none;
  }
  .no-support{
    background:var(--clay-light);color:#8a4a26;padding:16px 20px;
    border-radius:12px;font-size:14px;margin-bottom:24px;
  }

  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;}

  @media (max-width:520px){
    .wrap{padding:28px 14px 80px;}
    h1{font-size:27px;}
    .card{padding:22px 18px;}
    .target{font-size:22px;}
    .rung{font-size:12px;padding:10px 4px;}
    button{padding:14px 16px;width:100%;justify-content:center;}
    .controls{flex-direction:column;}
  }

/* ---------- 題庫擴充 ---------- */
// 已存在的 en 集合（避免重複）
function existingEnSet(stage){
  const set = new Set();
  stage.items.forEach(it => set.add(it.en.toLowerCase()));
  return set;
}

// 初始化時將 WORD_BANK 的所有內容載入，確保所有類別都會顯示
function initBank(){
  if(typeof WORD_BANK === 'undefined') return;
  STAGES.forEach(stage => {
    const bankItems = WORD_BANK[stage.key];
    if(bankItems && bankItems.length){
      const existing = existingEnSet(stage);
      bankItems.forEach(item => {
        if(!existing.has(item.en.toLowerCase())){
          stage.items.push({...item});
          existing.add(item.en.toLowerCase());
        }
      });
    }
  });
}

const DICT_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';

let stageIdx = 0;
let itemIdx = 0;
let activeCat = 'all';
let recognition = null;
let isRecording = false;
let accentPref = 'us';

const el = id => document.getElementById(id);

/* ---------- 字典 API 串接 (Free Dictionary API) ---------- */

async function fetchWordData(word){
  const clean = word.toLowerCase().trim();
  const url = DICT_API + encodeURIComponent(clean);
  const res = await fetch(url);
  if(!res.ok) throw new Error('查詢失敗 (' + res.status + ')');
  const data = await res.json();
  if(!Array.isArray(data) || !data.length) throw new Error('無資料');
  const entry = data[0];
  // 擷取音標與音檔
  const variants = {};
  const phonetics = entry.phonetics || [];
  // 全局音標
  const globalPhon = entry.phonetic || '';
  phonetics.forEach(p => {
    if(!p.audio) return;
    const audioUrl = p.audio;
    const isUS = audioUrl.includes('-us') || audioUrl.includes('_us');
    const isUK = audioUrl.includes('-uk') || audioUrl.includes('_uk');
    const key = isUS ? 'us' : isUK ? 'uk' : null;
    if(key && !variants[key]){
      variants[key] = { audio: audioUrl, phon: p.text || globalPhon };
    }
  });
  // 如果只有一個音檔但沒被分類
  if(!variants.us && !variants.uk && phonetics.length > 0){
    const p = phonetics.find(x => x.audio) || phonetics[0];
    variants.us = { audio: p.audio || '', phon: p.text || globalPhon };
  }
  // 如果連音檔都沒有，至少給音標
  if(!variants.us && !variants.uk && globalPhon){
    variants.us = { audio: '', phon: globalPhon };
  }
  return { zh: null, variants };
}

function getVariant(item){
  if(!item || !item.variants) return null;
  return item.variants[accentPref] || item.variants.us || item.variants.uk || null;
}

// 背景查詢單字資料（音檔、音標），完成後如果還在看同一題就重繪
function fetchAndEnrich(item){
  if(item._fetching || item._fetched) return;
  item._fetching = true;
  fetchWordData(item.en).then(data => {
    item.variants = data.variants;
    item._fetched = true;
  }).catch(() => {
    item._fetched = true;
  }).finally(() => {
    item._fetching = false;
    if(currentItem() === item) render();
  });
}

// 把音標字串拆成音節，並把重音節放大加粗
// 支援兩種格式：
// 1. 有 . 分隔：/kəˈlæb.ə.reɪt/ (Cambridge 格式)
// 2. 無 . 分隔：/kəˈlæbəˌreɪt/ (Free Dictionary 格式)
function renderPhonetics(phon){
  const block = el('phonBlock');
  const visual = el('phonVisual');
  if(!phon){ block.style.display = 'none'; visual.innerHTML = ''; return; }
  block.style.display = 'block';
  const clean = phon.replace(/^\/|\/$/g,'').trim();

  let syllables;
  const dotParts = clean.split('.').filter(Boolean);

  if(dotParts.length > 1){
    // 格式 1: 用 . 分隔的音標
    syllables = dotParts.map(syl => ({
      text: syl.replace(/[ˈˌ]/g,''),
      stressed: /ˈ/.test(syl),
      secondary: /ˌ/.test(syl)
    }));
  } else {
    // 格式 2: 用重音符號拆分 (ˈ 主重音, ˌ 次重音)
    // 先在 ˈ 和 ˌ 前面插入分隔符，再拆分
    const marked = clean.replace(/([ˈˌ])/g, '|$1');
    const parts = marked.split('|').filter(Boolean);
    if(parts.length <= 1){
      // 單音節或無法拆分，直接顯示原始音標
      visual.innerHTML = '<span class="phon-raw">/' + clean + '/</span>';
      return;
    }
    syllables = parts.map(syl => ({
      text: syl.replace(/[ˈˌ]/g,''),
      stressed: syl.startsWith('ˈ'),
      secondary: syl.startsWith('ˌ')
    }));
  }

  visual.innerHTML = syllables.map(s => {
    const cls = s.stressed ? ' stressed' : '';
    return '<span class="syl' + cls + '">' + s.text + '</span>';
  }).join('<span class="dot"> · </span>');
}

function categoriesFor(stage){
  const set = [];
  stage.items.forEach(it => { if(it.cat && !set.includes(it.cat)) set.push(it.cat); });
  return set;
}

function filteredItems(){
  const stage = currentStage();
  if(activeCat === 'all') return stage.items;
  return stage.items.filter(it => it.cat === activeCat);
}

function renderLadder(){
  const ladder = el('ladder');
  ladder.innerHTML = '';
  STAGES.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'rung' + (i===stageIdx?' active':'');
    d.textContent = s.label;
    d.onclick = () => { stageIdx = i; itemIdx = 0; activeCat = 'all'; render(); };
    ladder.appendChild(d);
  });
}

function renderCats(){
  const wrap = el('cats');
  wrap.innerHTML = '';
  const cats = categoriesFor(currentStage());
  const allPill = document.createElement('div');
  allPill.className = 'cat-pill' + (activeCat==='all'?' active':'');
  allPill.textContent = '全部';
  allPill.onclick = () => { activeCat='all'; itemIdx=0; render(); };
  wrap.appendChild(allPill);
  cats.forEach(c => {
    const p = document.createElement('div');
    p.className = 'cat-pill' + (activeCat===c?' active':'');
    p.textContent = c;
    p.onclick = () => { activeCat=c; itemIdx=0; render(); };
    wrap.appendChild(p);
  });
}

function currentStage(){ return STAGES[stageIdx]; }
function currentItem(){
  const items = filteredItems();
  if(itemIdx >= items.length) itemIdx = 0;
  return items[itemIdx];
}

function render(){
  renderLadder();
  const stage = currentStage();
  el('stageDesc').textContent = stage.desc;
  renderCats();
  el('targetLabel').textContent = stage.label === '自由回答' ? '看情境,講一句' : '跟著念';
  const item = currentItem();
  if(!item){ el('target').textContent = '這個類別還沒有題目'; el('targetZh').textContent=''; el('targetCat').textContent=''; el('counter').textContent=''; renderPhonetics(null); return; }
  el('target').textContent = item.en;
  el('targetZh').textContent = item.zh || '';
  el('targetCat').textContent = item.cat || '';
  el('counter').textContent = (itemIdx+1) + ' / ' + filteredItems().length;
  el('result').classList.remove('show');
  el('recBtn').textContent = '🎙 點擊開始錄音';
  el('recBtn').classList.remove('recording');
  el('liveTranscript').textContent = '';

  renderPhonetics(getVariant(item) ? getVariant(item).phon : null);

  // 對所有單字（不含空格的英文）自動查字典取得音標
  if(!/\s/.test(item.en) && !item._fetched && !item._fetching){
    fetchAndEnrich(item);
  }
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// 雙軌發音：優先播放 Google 高音質 TTS，播放失敗就退回瀏覽器 TTS
function playAudio(item){
  speechSynthesis.cancel(); // 確保不會有聲音重疊
  
  const text = encodeURIComponent(item.en);
  const tl = accentPref === 'uk' ? 'en-GB' : 'en-US';
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${tl}&client=tw-ob&q=${text}`;
  
  let fellBack = false;
  const fallback = () => { if(!fellBack){ fellBack = true; speak(item.en); } };
  const audio = new Audio(url);
  audio.addEventListener('error', fallback);
  audio.play().catch(fallback);
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function normalize(s){
  return s.toLowerCase().replace(/[^\w\s']/g,'').trim();
}

function showResult(heardText){
  const item = currentItem();
  const isFree = currentStage().key === 'free';
  el('heard').textContent = heardText || '(沒聽到聲音)';
  el('result').classList.add('show');
  const fb = el('feedback');

  if(isFree){
    fb.className = 'feedback';
    fb.textContent = heardText ? '你講出來了——這就是重點,內容不用完美。' : '再試一次,講出你想到的任何一句話就好。';
    return;
  }

  if(!heardText){
    fb.className = 'feedback retry';
    fb.textContent = '沒聽清楚,再按一次錄音試試看。';
    return;
  }

  const a = normalize(heardText);
  const b = normalize(item.en);
  const dist = levenshtein(a, b);
  const closeness = 1 - dist / Math.max(a.length, b.length, 1);

  if(closeness > 0.85){
    fb.className = 'feedback';
    fb.textContent = '很接近了,講得不錯!';
  } else if(closeness > 0.5){
    fb.className = 'feedback retry';
    fb.textContent = '有講到重點,但跟原句有點差距,可以再跟讀一次原音。';
  } else {
    fb.className = 'feedback retry';
    fb.textContent = '差距比較大,先聽一次發音,再慢慢跟讀試試。';
  }
}

let SRClass = null;
let finalTranscript = '';
let gotResult = false;
let recStartTime = 0;
let recTimeoutTimer = null;
let micReady = false;

/* ---------- 麥克風預熱 ---------- */
async function warmUpMic(){
  if(micReady) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    micReady = true;
  }catch(e){
    // 權限被拒或不支援,後續 SpeechRecognition 會處理
  }
}

function setupRecognition(){
  SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SRClass){
    el('unsupported').style.display = 'block';
    el('recBtn').disabled = true;
    return;
  }
}

function buildRecognition(){
  const r = new SRClass();
  r.lang = 'en-US';
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;

  r.onresult = (e) => {
    // 關鍵修正：iOS Safari 不一定送出 isFinal=true
    // 因此持續儲存最新 transcript，不論 isFinal 狀態
    let interim = '';
    let final = '';
    for(let i = 0; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += t;
      else interim += t;
    }
    // 優先用 final，沒有就用 interim
    finalTranscript = final || interim;
    // 只要有任何內容就算有結果
    if(finalTranscript) gotResult = true;
    // 即時顯示辨識文字
    el('liveTranscript').textContent = finalTranscript ? '聽到: ' + finalTranscript : '';
    // 收到結果就重置超時
    resetRecTimeout();
  };

  r.onspeechstart = () => {
    // 偵測到說話聲,重置超時
    resetRecTimeout();
  };

  r.onerror = (e) => {
    clearTimeout(recTimeoutTimer);
    const messages = {
      'not-allowed':'麥克風權限被拒絕,請到設定 > Safari > 麥克風開啟權限。',
      'no-speech':'沒偵測到說話聲,請靠近麥克風再試一次。',
      'audio-capture':'抓不到麥克風,請確認沒有其他 App 正在使用麥克風。',
      'network':'網路連線問題,語音辨識需要網路連線。',
      'aborted':''
    };
    const msg = messages[e.error];
    if(msg){
      // 標記已有結果以防 onend 重複處理
      gotResult = true;
      finalTranscript = '';
      showErrorMsg(msg);
    }
  };

  r.onend = () => {
    clearTimeout(recTimeoutTimer);
    isRecording = false;
    el('recBtn').textContent = '🎙 點擊開始錄音';
    el('recBtn').classList.remove('recording');
    el('liveTranscript').textContent = '';
    // 關鍵修正：只要 finalTranscript 有內容就視為成功
    if(finalTranscript){
      showResult(finalTranscript);
    } else if(!gotResult){
      // 真的完全沒收到任何東西
      showErrorMsg('沒有聽到聲音。請確認麥克風正常,點擊錄音後立刻開口說話。');
    }
    // 如果 gotResult=true 但 finalTranscript='' → onerror 已經處理過了,不重複顯示
  };
  return r;
}

function resetRecTimeout(){
  clearTimeout(recTimeoutTimer);
  // 8 秒無新結果就自動停止
  recTimeoutTimer = setTimeout(() => {
    if(isRecording && recognition){
      try{ recognition.stop(); }catch(e){}
    }
  }, 8000);
}

function showErrorMsg(msg){
  el('heard').textContent = '';
  el('result').classList.add('show');
  const fb = el('feedback');
  fb.className = 'feedback retry';
  fb.textContent = msg;
}

function checkMobile(){
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const note = el('mobileNote');
  if(isIOS){
    note.style.display = 'block';
    note.textContent = 'iPhone 使用中：請確認是用 Safari 開啟這個頁面（不是 LINE 或 IG 內建瀏覽器），語音辨識才會正常運作。';
  } else if(isAndroid){
    note.style.display = 'block';
    note.textContent = 'Android 使用中：請用 Chrome 開啟這個頁面，語音辨識才會正常運作。';
  }
}

el('playBtn').onclick = () => playAudio(currentItem());

function updateAccentButtons(){
  el('accentUS').classList.toggle('active', accentPref === 'us');
  el('accentUK').classList.toggle('active', accentPref === 'uk');
}
el('accentUS').onclick = () => { accentPref = 'us'; updateAccentButtons(); const it=currentItem(); if(it) renderPhonetics(getVariant(it) ? getVariant(it).phon : null); };
el('accentUK').onclick = () => { accentPref = 'uk'; updateAccentButtons(); const it=currentItem(); if(it) renderPhonetics(getVariant(it) ? getVariant(it).phon : null); };

/* ---------- 錄音：點擊切換模式 ---------- */
const MIN_REC_MS = 1500; // 最小錄音時間,防止太快 stop

function startRecording(){
  if(!SRClass) return;
  // 預熱麥克風（不使用 await，讓 SpeechRecognition 在同一個同步執行緒中啟動，避免 iOS 阻擋）
  warmUpMic();
  speechSynthesis.cancel();
  isRecording = true;
  gotResult = false;
  finalTranscript = '';
  recStartTime = Date.now();
  el('recBtn').textContent = '⏹ 點擊結束錄音';
  el('recBtn').classList.add('recording');
  el('liveTranscript').textContent = '正在聆聽...';
  el('result').classList.remove('show');
  recognition = buildRecognition();
  try{ recognition.start(); }catch(e){
    isRecording = false;
    el('recBtn').textContent = '🎙 點擊開始錄音';
    el('recBtn').classList.remove('recording');
    el('liveTranscript').textContent = '';
    showErrorMsg('無法啟動麥克風，重新整理頁面後再試一次。');
  }
  // 啟動超時保護
  resetRecTimeout();
}

function stopRecording(){
  if(!isRecording) return;
  // 確保至少錄 MIN_REC_MS 毫秒
  const elapsed = Date.now() - recStartTime;
  if(elapsed < MIN_REC_MS){
    setTimeout(() => {
      if(isRecording && recognition){
        try{ recognition.stop(); }catch(e){}
      }
    }, MIN_REC_MS - elapsed);
  } else {
    if(recognition) try{ recognition.stop(); }catch(e){}
  }
}

/* ---------- 錄音按鈕：點擊切換 ---------- */
const recBtn = el('recBtn');
recBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if(isRecording){
    stopRecording();
  } else {
    startRecording();
  }
});

el('skipBtn').onclick = () => {
  const items = filteredItems();
  itemIdx = (itemIdx+1) % items.length;
  render();
};

function populateCustomStageSelect(){
  const sel = el('customStage');
  sel.innerHTML = '';
  STAGES.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = s.label;
    sel.appendChild(opt);
  });
}

el('addBtn').onclick = async () => {
  const en = el('customEn').value.trim();
  const zh = el('customZh').value.trim();
  const idx = parseInt(el('customStage').value, 10);
  if(!en) return;
  const stage = STAGES[idx];
  const item = { en, zh, cat:'自訂' };
  const isSingleWord = !/\s/.test(en);
  const addBtn = el('addBtn');

  if(isSingleWord){
    addBtn.disabled = true;
    addBtn.textContent = '查詢中...';
    try{
      const data = await fetchWordData(en);
      item.variants = data.variants;
      item._fetched = true;
    }catch(err){
      item._fetched = true; // 查不到就交給 speechSynthesis,不擋住新增流程
    }
    addBtn.disabled = false;
  }

  stage.items.push(item);
  el('customEn').value = '';
  el('customZh').value = '';
  addBtn.textContent = '已加入 ✓';
  setTimeout(()=>{ addBtn.textContent = '加入'; }, 1200);
  if(idx === stageIdx) render();
};

checkMobile();
initBank();
populateCustomStageSelect();
setupRecognition();
render();
</script>
