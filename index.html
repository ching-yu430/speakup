<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>開口練習 Speak Up</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#20261f;
    --paper:#f6f3ea;
    --card:#ffffff;
    --sage:#5c7a5e;
    --sage-dark:#3c5a3e;
    --sage-light:#e4ebe0;
    --clay:#c17a52;
    --clay-light:#f3e2d5;
    --line:#dcd6c4;
    --muted:#8a8577;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 100px;}

  header{margin-bottom:28px;}
  .sub{color:var(--muted);font-size:15px;max-width:520px;}

  .eyebrow{
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--sage-dark);font-weight:600;margin-bottom:8px;
  }

  .app-tabs {
    display: flex; gap: 8px; margin-bottom: 24px; padding: 4px;
    background: #e4ebe0; border-radius: 12px;
  }
  .app-tab {
    flex: 1; padding: 12px 0; border: none; background: transparent;
    border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted);
    cursor: pointer; transition: all 0.2s;
  }
  .app-tab.active { background: #fff; color: var(--sage-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

  .ai-actions { margin-bottom: 16px; }
  .ai-create-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: 2px dashed #b77bff;
    background: rgba(138,43,226,0.05); color: #8a2be2; font-weight: bold; font-size: 14px;
    cursor: pointer; transition: all 0.2s;
  }
  .ai-create-btn:hover { background: rgba(138,43,226,0.1); }
  
  .ai-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
    display: none; justify-content: center; align-items: center; z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .ai-modal-overlay.show { display: flex; }
  .ai-modal {
    background: var(--card); width: 90%; max-width: 400px; padding: 24px;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative;
  }
  .ai-modal-close {
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    font-size: 24px; cursor: pointer; color: var(--muted);
  }

  .ladder{
    display:flex;gap:6px;margin:24px 0 16px;
  }
  .rung{
    flex:1;padding:12px 6px;text-align:center;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
    transition:all .2s;
  }
  .rung.active{
    background:var(--sage);color:#fff;border-color:var(--sage);
  }

  .stage-desc{
    font-size:14px;color:var(--muted);margin-bottom:16px;padding-left:2px;
  }

  .cats{
    display:flex;gap:8px;margin-bottom:24px;
    overflow-x:auto; padding-bottom:4px; flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar { display:none; }
  .cat-pill{
    flex-shrink:0;
    padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:13px;color:var(--muted);cursor:pointer;
    font-weight:500;transition:all .15s;
  }
  .cat-pill.active{background:var(--clay);color:#fff;border-color:var(--clay);}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;margin-bottom:20px;
  }

  .target-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .target-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .target-cat{font-size:12px;color:var(--clay);font-weight:600;}
  .target{
    font-family:'Fraunces',serif;font-size:27px;font-weight:500;
    color:var(--ink);margin-bottom:6px;line-height:1.4;
  }
  .target-zh{color:var(--muted);font-size:15px;margin-bottom:24px;}

  .phon-block{margin:-8px 0 22px;}
  .phon-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .phon-visual{font-family:'Fraunces',serif;font-size:16px;color:var(--muted);letter-spacing:.02em;}
  .phon-visual .syl{transition:all .15s;}
  .phon-visual .syl.stressed{font-size:23px;font-weight:600;color:var(--clay);}
  .phon-visual .dot{color:var(--line);padding:0 2px;}
  .phon-visual .phon-raw{font-size:16px;color:var(--muted);}

  .accent-row{display:flex;gap:6px;margin-bottom:2px;}
  .accent-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    border-radius:999px;border:1px solid var(--line);background:#fff;
    padding:6px 12px;cursor:pointer;color:var(--muted);
    -webkit-user-select:none;user-select:none;
  }
  .accent-btn.active{background:var(--sage-light);color:var(--sage-dark);border-color:var(--sage);}

  .controls {
    display: flex; justify-content: center; align-items: center; gap: 24px;
    margin: 32px 0 24px;
  }
  .btn-mic {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--clay); color: #fff; border: none;
    font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(193,122,82,0.3); transition: all 0.2s; padding: 0;
  }
  .btn-mic:hover { transform: scale(1.05); }
  .btn-mic:active { transform: scale(0.95); }
  .btn-mic.recording {
    background: #e63946; box-shadow: 0 0 0 0 rgba(230,57,70,0.5);
    animation: pulse-rec-new 1.2s ease-in-out infinite;
  }
  @keyframes pulse-rec-new {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
    50% { box-shadow: 0 0 0 16px rgba(230,57,70,0); }
  }
  .btn-play {
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--sage-light); color: var(--sage-dark); border: none;
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; padding: 0;
  }
  .btn-play:hover { background: var(--sage); color: #fff; }

  button.skip {
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
    border-radius:10px;border:1px solid var(--line);background:#fff;
    padding:13px 18px;cursor:pointer;color:var(--ink);
    display:inline-flex;align-items:center;gap:8px;
    transition:all .15s;-webkit-user-select:none;user-select:none;
  }
  button.skip:hover { border-color:var(--sage); }
  button.skip:active { transform:scale(.97); }
  #recBtn{touch-action:none;-webkit-user-select:none;user-select:none;}

  .live-transcript{
    margin-top:10px;font-size:14px;color:var(--muted);font-style:italic;
    min-height:22px;transition:opacity .2s;
  }
  .live-transcript:empty{opacity:0;}
  .live-transcript:not(:empty){opacity:1;}

  .result{
    margin-top:20px;padding-top:20px;border-top:1px solid var(--line);
    display:none;
  }
  .result.show{display:block;}
  .you-said{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .heard{font-size:18px;margin-bottom:14px;}
  .feedback{
    font-size:14px;padding:12px 16px;border-radius:10px;
    background:var(--sage-light);color:var(--sage-dark);
  }
  .feedback.retry{background:var(--clay-light);color:#8a4a26;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:10px;}
  .counter{font-size:13px;color:var(--muted);}
  .skip{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;font-weight:400;}

  details.add-panel{
    margin-top:32px;
  }
  details.add-panel summary{
    cursor:pointer;font-size:14px;color:var(--muted);text-decoration:underline;
    list-style:none;-webkit-user-select:none;user-select:none;
  }
  details.add-panel summary::-webkit-details-marker{display:none;}
  .add-body{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;}
  .add-row input{
    flex:1;min-width:140px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);font-size:14px;font-family:'Inter',sans-serif;
    background:#fff;color:var(--ink);
  }
  .add-row input:focus{outline:none;border-color:var(--sage);}
  .add-row select{
    padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }

  .mobile-note{
    background:var(--sage-light);color:var(--sage-dark);padding:14px 18px;
    border-radius:12px;font-size:13px;margin-bottom:20px;display:none;
  }
  .no-support{
    background:var(--clay-light);color:#8a4a26;padding:16px 20px;
    border-radius:12px;font-size:14px;margin-bottom:24px;
  }

  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;}

  @media (max-width:520px){
    .wrap{padding:20px 14px 80px;}
    h1{font-size:24px;}
    .card{padding:24px 16px;}
    .target{font-size:24px;}
    .target-zh{font-size:14px; margin-bottom:16px;}
    .rung{font-size:12px;padding:10px 4px;}
    
    .nav-row { margin-top: 32px; }
    .nav-row > div { display: flex; gap: 8px; width: 100%; justify-content: space-between; margin-top: 12px; }
    button.skip { padding: 12px; flex: 1; justify-content: center; margin: 0 !important; }
  }
</style>
</head>
<body>
<script src="word_bank.js"></script>

<div class="wrap">

  <header>
    <div class="eyebrow">Speak Up · 開口練習</div>
    <h1>先開口,再求準。</h1>
    <div class="sub">從單字到片語、句子,一步步習慣「講出聲音」這件事。題目網頁幫你準備好了,選類別就能一直練下去。</div>
  </header>

  <nav class="app-tabs">
    <button class="app-tab active" id="tabGeneral">📚 系統題庫</button>
    <button class="app-tab" id="tabAI">✨ 專屬情境 (AI)</button>
  </nav>

  <div class="ai-actions" id="aiActions" style="display:none;">
    <button class="ai-create-btn" id="openAiModalBtn">🚀 ＋ 請 AI 生成新情境...</button>
  </div>

  <div id="unsupported" class="no-support" style="display:none;">
    這個瀏覽器不支援語音辨識。iPhone 請用 Safari 開啟,Android 請用 Chrome 開啟;你還是可以看內容跟讀練習,只是沒辦法自動比對發音。
  </div>

  <div class="ladder" id="ladder"></div>
  <div class="stage-desc" id="stageDesc"></div>
  <div class="cats" id="cats"></div>

  <div class="card">
    <div class="target-meta">
      <div class="target-label" id="targetLabel">跟著念</div>
      <div class="target-cat" id="targetCat"></div>
    </div>
    <div class="target" id="target">Loading...</div>
    <div class="target-zh" id="targetZh"></div>

    <div class="phon-block" id="phonBlock" style="display:none;">
      <div class="phon-label">音節與重音</div>
      <div class="phon-visual" id="phonVisual"></div>
    </div>

    <div class="accent-row">
      <button class="accent-btn active" id="accentUS" type="button">🇺🇸 美式</button>
      <button class="accent-btn" id="accentUK" type="button">🇬🇧 英式</button>
    </div>

    <div class="controls">
      <button class="btn-play" id="playBtn" title="播放發音">🔊</button>
      <button class="btn-mic" id="recBtn" title="點擊錄音">🎙</button>
    </div>
    <div class="live-transcript" id="liveTranscript"></div>

    <div class="result" id="result">
      <div class="you-said">你講的是</div>
      <div class="heard" id="heard"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="nav-row">
      <span class="counter" id="counter"></span>
      <div>
        <button class="skip" id="prevBtn" style="margin-right:8px;">← 上一題</button>
        <button class="skip" id="skipBtn">下一題 →</button>
      </div>
    </div>
  </div>

  <div class="ai-modal-overlay" id="aiModal">
    <div class="ai-modal">
      <button class="ai-modal-close" id="closeAiModalBtn">×</button>
      <h2 style="margin-top:0; color:#8a2be2; font-size: 20px;">✨ AI 無限情境生成器</h2>
      <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">利用最新 Gemini 3.6 Flash 模型，立刻為你生成專屬的實用對話與單字。</p>
      <input type="password" id="apiKeyInput" placeholder="輸入你的 Gemini API Key (僅存在本地)" style="width:100%; margin-bottom: 8px; border: 1px solid var(--line); padding:10px; border-radius: 8px; font-family: 'Inter';">
      <input type="text" id="aiScenarioInput" placeholder="想練習的情境？例如：在機場跟地勤吵架" style="width:100%; margin-bottom: 16px; border: 1px solid var(--line); padding:10px; border-radius: 8px; font-family: 'Inter';">
      <button id="aiGenerateBtn" style="background: linear-gradient(135deg, #8a2be2, #4169e1); border:none; padding: 12px; border-radius: 8px; color:white; cursor:pointer; width:100%; font-weight: bold; font-size: 14px;">🚀 立即生成題目</button>
      <div id="aiStatus" style="margin-top: 12px; font-size: 0.9rem; color: #c17a52; text-align: center;"></div>
    </div>
  </div>
  <details class="add-panel">
    <summary>想加自己的內容?點這裡展開(選填,不影響上面的題庫)</summary>
    <div class="add-body">
      <div class="add-row">
        <select id="customStage"></select>
        <input type="text" id="customEn" placeholder="英文,例如 catch up on(單字類會自動查字典)">
        <input type="text" id="customZh" placeholder="中文意思(單字類可留空,自動帶入)">
        <button id="addBtn">加入</button>
      </div>
    </div>
  </details>

  <footer>沒有標準答案,只有講出口的你。</footer>
</div>

<script>
const el = id => document.getElementById(id);

/* ---------- 題庫初始化 ---------- */
const STAGES = [
  {
    key:'word', label:'單字', desc:'看到單字，念出聲就好——不用完美，只要開口。',
    items:[
      {en:'candidate', zh:'應徵者、候選人', cat:'面試'},
      {en:'strength', zh:'優勢、強項', cat:'面試'},
      {en:'weakness', zh:'弱點', cat:'面試'},
      {en:'available', zh:'有空的、可到職的', cat:'面試'},
      {en:'internship', zh:'實習', cat:'面試'},
      {en:'agenda', zh:'議程', cat:'開會'},
      {en:'deadline', zh:'截止日期', cat:'開會'},
      {en:'collaborate', zh:'合作', cat:'開會'},
      {en:'update', zh:'進度更新', cat:'開會'},
      {en:'feedback', zh:'回饋、意見', cat:'開會'},
      {en:'research', zh:'研究', cat:'學術'},
      {en:'hypothesis', zh:'假設', cat:'學術'},
      {en:'methodology', zh:'研究方法', cat:'學術'},
      {en:'significant', zh:'顯著的', cat:'學術'},
      {en:'literature', zh:'文獻', cat:'學術'},
      {en:'introduce', zh:'介紹', cat:'社交'},
      {en:'industry', zh:'產業', cat:'社交'},
      {en:'network', zh:'建立人脈', cat:'社交'},
      {en:'appreciate', zh:'感激', cat:'社交'},
      {en:'colleague', zh:'同事', cat:'社交'}
    ]
  },
  {
    key:'phrase', label:'片語', desc:'兩三個字一組，開始練習講話的節奏感。',
    items:[
      {en:'apply for a position', zh:'應徵一個職缺', cat:'面試'},
      {en:'a good fit for', zh:'很適合...', cat:'面試'},
      {en:'work under pressure', zh:'在壓力下工作', cat:'面試'},
      {en:'take the initiative', zh:'主動採取行動', cat:'面試'},
      {en:'strengths and weaknesses', zh:'優點與缺點', cat:'面試'},
      {en:'be responsible for', zh:'負責...', cat:'開會'},
      {en:'follow up on', zh:'追蹤、後續跟進', cat:'開會'},
      {en:'meet the deadline', zh:'趕上截止日期', cat:'開會'},
      {en:'give an update on', zh:'報告...的進度', cat:'開會'},
      {en:'run into an issue', zh:'遇到一個問題', cat:'開會'},
      {en:'present my findings', zh:'發表我的研究結果', cat:'學術'},
      {en:'based on the data', zh:'根據這些數據', cat:'學術'},
      {en:'in terms of', zh:'就...方面而言', cat:'學術'},
      {en:'further research is needed', zh:'需要進一步研究', cat:'學術'},
      {en:'nice to meet you', zh:'很高興認識你', cat:'社交'},
      {en:'what do you do', zh:'你是做什麼工作的', cat:'社交'},
      {en:'keep in touch', zh:'保持聯絡', cat:'社交'},
      {en:'look forward to', zh:'期待', cat:'社交'}
    ]
  },
  {
    key:'sentence', label:'句子', desc:'完整句子，練語調跟停頓，講出一整句話。',
    items:[
      {en:"Could you tell me a bit about yourself?", zh:'可以簡單自我介紹一下嗎？', cat:'面試'},
      {en:"I'm currently finishing my master's degree in...", zh:'我目前正在完成…的碩士學位。', cat:'面試'},
      {en:"I believe my background makes me a strong fit for this role.", zh:'我相信我的背景讓我很適合這個職位。', cat:'面試'},
      {en:"Can you tell me more about the team I'd be working with?", zh:'可以多說一些我會加入的團隊嗎？', cat:'面試'},
      {en:"Could we push the meeting to tomorrow?", zh:'我們可以把會議延到明天嗎？', cat:'開會'},
      {en:"I'm not sure, let me check and get back to you.", zh:'我不確定，讓我確認後回覆你。', cat:'開會'},
      {en:"Could you clarify what the timeline looks like?", zh:'可以請你說明一下時程大概是怎樣嗎？', cat:'開會'},
      {en:"I'd like to walk you through my results.", zh:'我想跟你說明一下我的研究結果。', cat:'學術'},
      {en:"My research focuses on how X affects Y.", zh:'我的研究聚焦在X如何影響Y。', cat:'學術'},
      {en:"That's a great question, let me think about it.", zh:'這是個好問題，讓我想一下。', cat:'學術'},
      {en:"So, what brings you to this event?", zh:'那，是什麼讓你來參加這個活動的呢？', cat:'社交'},
      {en:"Thanks for your time, it was great talking to you.", zh:'謝謝你的時間，很高興跟你聊天。', cat:'社交'}
    ]
  },
  {
    key:'free', label:'自由回答', desc:'看到情境，自己講一句——沒有標準答案，講出來就是贏。',
    items:[
      {en:"Introduce yourself in 30 seconds, as if in a job interview.", zh:'用30秒自我介紹，想像是在面試場合。', cat:'面試'},
      {en:"Tell me why you're interested in this industry.", zh:'說說你為什麼對這個產業有興趣。', cat:'面試'},
      {en:"Describe a challenge you faced and how you handled it.", zh:'描述一個你遇到的挑戰，還有你怎麼處理的。', cat:'面試'},
      {en:"Explain a time you worked in a team.", zh:'描述一次你在團隊中合作的經驗。', cat:'開會'},
      {en:"Give a 1-minute status update on a made-up project.", zh:'假裝有個專案，做一分鐘的進度報告。', cat:'開會'},
      {en:"Explain your thesis topic to someone outside your field.", zh:'跟一個非本科系的人解釋你的論文主題。', cat:'學術'},
      {en:"Describe a challenge you faced during your research.", zh:'描述你在研究過程中遇到的一個挑戰。', cat:'學術'},
      {en:"Introduce yourself at a networking event.", zh:'想像在一場社交活動中自我介紹。', cat:'社交'}
    ]
  }
];

/* ---------- 本地儲存進度記憶 ---------- */
let savedStageIdx = localStorage.getItem('speakup_stageIdx');
let savedCat = localStorage.getItem('speakup_cat');
let savedCatProgressStr = localStorage.getItem('speakup_cat_progress');
let catProgress = savedCatProgressStr ? JSON.parse(savedCatProgressStr) : {};
let geminiApiKey = localStorage.getItem('speakup_apikey') || '';
let appMode = localStorage.getItem('speakup_appMode') || 'general';

function getSavedItemIdx(sIdx, cat) {
  const key = `${sIdx}_${cat}`;
  return catProgress[key] || 0;
}

let stageIdx = savedStageIdx ? parseInt(savedStageIdx, 10) : 0;
let activeCat = savedCat || 'all';
let itemIdx = getSavedItemIdx(stageIdx, activeCat);

function saveProgress(){

// 已存在的 en 集合（避免重複）
function existingEnSet(stage){
  const set = new Set();
  stage.items.forEach(it => set.add(it.en.toLowerCase()));
  return set;
}

// 初始化時將 WORD_BANK 的所有內容載入，確保所有類別都會顯示
function initBank(){
  if(typeof WORD_BANK === 'undefined') return;
  
  // 注入 AI 生成的題目
  aiGeneratedItems.forEach(item => {
    const targetKey = item._type || 'word';
    if(WORD_BANK[targetKey]) {
      WORD_BANK[targetKey].push(item);
    }
  });

  STAGES.forEach(stage => {
    const bankItems = WORD_BANK[stage.key];
    if(bankItems && bankItems.length){
      const existing = existingEnSet(stage);
      bankItems.forEach(item => {
        if(!existing.has(item.en.toLowerCase())){
          stage.items.push({...item});
          existing.add(item.en.toLowerCase());
        }
      });
    }
  });
}
initBank();

const DICT_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';

let recognition = null;
let isRecording = false;
let accentPref = 'us';

/* ---------- 字典 API 串接 (Free Dictionary API) ---------- */

async function fetchWordData(word){
  const clean = word.toLowerCase().trim();
  const url = DICT_API + encodeURIComponent(clean);
  const res = await fetch(url);
  if(!res.ok) throw new Error('查詢失敗 (' + res.status + ')');
  const data = await res.json();
  if(!Array.isArray(data) || !data.length) throw new Error('無資料');
  const entry = data[0];
  // 擷取音標與音檔
  const variants = {};
  const phonetics = entry.phonetics || [];
  // 全局音標
  const globalPhon = entry.phonetic || '';
  phonetics.forEach(p => {
    if(!p.audio) return;
    const audioUrl = p.audio;
    const isUS = audioUrl.includes('-us') || audioUrl.includes('_us');
    const isUK = audioUrl.includes('-uk') || audioUrl.includes('_uk');
    const key = isUS ? 'us' : isUK ? 'uk' : null;
    if(key && !variants[key]){
      variants[key] = { audio: audioUrl, phon: p.text || globalPhon };
    }
  });
  // 如果只有一個音檔但沒被分類
  if(!variants.us && !variants.uk && phonetics.length > 0){
    const p = phonetics.find(x => x.audio) || phonetics[0];
    variants.us = { audio: p.audio || '', phon: p.text || globalPhon };
  }
  // 如果連音檔都沒有，至少給音標
  if(!variants.us && !variants.uk && globalPhon){
    variants.us = { audio: '', phon: globalPhon };
  }
  return { zh: null, variants };
}

function getVariant(item){
  if(!item || !item.variants) return null;
  return item.variants[accentPref] || item.variants.us || item.variants.uk || null;
}

// 背景查詢單字資料（音檔、音標），完成後如果還在看同一題就重繪
function fetchAndEnrich(item){
  if(item._fetching || item._fetched) return;
  item._fetching = true;
  fetchWordData(item.en).then(data => {
    item.variants = data.variants;
    item._fetched = true;
  }).catch(() => {
    item._fetched = true;
  }).finally(() => {
    item._fetching = false;
    if(currentItem() === item) render();
  });
}

// 把音標字串拆成音節，並把重音節放大加粗
function renderPhonetics(phon){
  const block = el('phonBlock');
  const visual = el('phonVisual');
  if(!phon){ block.style.display = 'none'; visual.innerHTML = ''; return; }
  block.style.display = 'block';
  const clean = phon.replace(/^\/|\/$/g,'').trim().replace(/ɹ/g, 'r').replace(/ɡ/g, 'g');

  // 確保重音符號和句點都可以作為音節分隔
  // 先把重音符號替換成具有分隔功能的格式，例如在前面加上句點
  let marked = clean.replace(/([ˈˌ])/g, '.$1');
  // 移除連續的句點（例如原本就有句點的地方變成 ..）
  marked = marked.replace(/\.+/g, '.');
  // 移除開頭的句點
  marked = marked.replace(/^\./, '');

  const parts = marked.split('.').filter(Boolean);
  if(parts.length <= 1){
    // 單音節，直接顯示
    visual.innerHTML = '<span class="phon-raw">/' + clean + '/</span>';
    return;
  }

  const syllables = parts.map(syl => ({
    text: syl.replace(/[ˈˌ]/g,''),
    stressed: syl.includes('ˈ'),
    secondary: syl.includes('ˌ')
  }));

  visual.innerHTML = syllables.map(s => {
    const cls = s.stressed ? ' stressed' : '';
    return '<span class="syl' + cls + '">' + s.text + '</span>';
  }).join('<span class="dot"> · </span>');
}

function categoriesForMode(mode) {
  const set = new Set();
  STAGES.forEach(stg => {
    stg.items.forEach(it => {
      if(it.cat) {
        const isAI = it.cat.startsWith('(AI)');
        if(mode === 'ai' && isAI) set.add(it.cat);
        if(mode === 'general' && !isAI && stg === currentStage()) set.add(it.cat); // General mode is stage-specific
      }
    });
  });
  return Array.from(set);
}

function filteredItems(){
  if(appMode === 'ai') {
    let items = [];
    STAGES.forEach(stg => {
      stg.items.forEach(it => {
        if(it.cat && it.cat.startsWith('(AI)')) {
          if(activeCat === 'all' || it.cat === activeCat) items.push(it);
        }
      });
    });
    return items;
  } else {
    const stage = currentStage();
    const items = stage.items.filter(it => !it.cat || !it.cat.startsWith('(AI)'));
    if(activeCat === 'all') return items;
    return items.filter(it => it.cat === activeCat);
  }
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// 播放發音：改為全面使用瀏覽器內建 TTS (speechSynthesis)
// 原因：1. 無雜音 (Free Dictionary 的 MP3 常有嚴重底噪)
//       2. 同步執行 (iOS Safari 嚴格禁止非同步或 Promise catch 內的語音合成，導致先前音檔失效時連備援 TTS 都播不出來)
function playAudio(item){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); // 確保不會有聲音重疊
  const u = new SpeechSynthesisUtterance(item.en);
  u.lang = accentPref === 'uk' ? 'en-GB' : 'en-US';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function normalize(s){
  return s.toLowerCase().replace(/[^\w\s']/g,'').trim();
}

function showResult(heardText){
  const item = currentItem();
  const isFree = currentStage().key === 'free';
  el('heard').textContent = heardText || '(沒聽到聲音)';
  el('result').classList.add('show');
  const fb = el('feedback');

  if(isFree){
    fb.className = 'feedback';
    fb.textContent = heardText ? '你講出來了——這就是重點,內容不用完美。' : '再試一次,講出你想到的任何一句話就好。';
    return;
  }

  if(!heardText){
    fb.className = 'feedback retry';
    fb.textContent = '沒聽清楚,再按一次錄音試試看。';
    return;
  }

  const a = normalize(heardText);
  const b = normalize(item.en);
  const dist = levenshtein(a, b);
  const closeness = 1 - dist / Math.max(a.length, b.length, 1);

  if(closeness > 0.85){
    fb.className = 'feedback';
    fb.textContent = '很接近了,講得不錯!';
  } else if(closeness > 0.5){
    fb.className = 'feedback retry';
    fb.textContent = '有講到重點,但跟原句有點差距,可以再跟讀一次原音。';
  } else {
    fb.className = 'feedback retry';
    fb.textContent = '差距比較大,先聽一次發音,再慢慢跟讀試試。';
  }
}

let SRClass = null;
let finalTranscript = '';
let gotResult = false;
let recStartTime = 0;
let recTimeoutTimer = null;
let micReady = false;

/* ---------- 麥克風預熱 ---------- */
async function warmUpMic(){
  if(micReady) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    micReady = true;
  }catch(e){
    // 權限被拒或不支援,後續 SpeechRecognition 會處理
  }
}

function setupRecognition(){
  SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SRClass){
    el('unsupported').style.display = 'block';
    el('recBtn').disabled = true;
    return;
  }
}

function buildRecognition(){
  const r = new SRClass();
  r.lang = 'en-US';
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;

  r.onresult = (e) => {
    // 關鍵修正：iOS Safari 不一定送出 isFinal=true
    // 因此持續儲存最新 transcript，不論 isFinal 狀態
    let interim = '';
    let final = '';
    for(let i = 0; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += t;
      else interim += t;
    }
    // 優先用 final，沒有就用 interim
    finalTranscript = final || interim;
    // 只要有任何內容就算有結果
    if(finalTranscript) gotResult = true;
    // 即時顯示辨識文字
    el('liveTranscript').textContent = finalTranscript ? '聽到: ' + finalTranscript : '';
    // 收到結果就重置超時
    resetRecTimeout();
  };

  r.onspeechstart = () => {
    // 偵測到說話聲,重置超時
    resetRecTimeout();
  };

  r.onerror = (e) => {
    clearTimeout(recTimeoutTimer);
    const messages = {
      'not-allowed':'麥克風權限被拒絕,請到設定 > Safari > 麥克風開啟權限。',
      'no-speech':'沒偵測到說話聲,請靠近麥克風再試一次。',
      'audio-capture':'抓不到麥克風,請確認沒有其他 App 正在使用麥克風。',
      'network':'網路連線問題,語音辨識需要網路連線。',
      'aborted':''
    };
    const msg = messages[e.error];
    if(msg){
      // 標記已有結果以防 onend 重複處理
      gotResult = true;
      finalTranscript = '';
      showErrorMsg(msg);
    }
  };

  r.onend = () => {
    clearTimeout(recTimeoutTimer);
    isRecording = false;
    el('recBtn').innerHTML = '🎙';
    el('recBtn').classList.remove('recording');
    el('liveTranscript').textContent = '';
    // 關鍵修正：只要 finalTranscript 有內容就視為成功
    if(finalTranscript){
      showResult(finalTranscript);
    } else if(!gotResult){
      // 真的完全沒收到任何東西
      showErrorMsg('沒有聽到聲音。請確認麥克風正常,點擊錄音後立刻開口說話。');
    }
    // 如果 gotResult=true 但 finalTranscript='' → onerror 已經處理過了,不重複顯示
  };
  return r;
}

function resetRecTimeout(){
  clearTimeout(recTimeoutTimer);
  // 8 秒無新結果就自動停止
  recTimeoutTimer = setTimeout(() => {
    if(isRecording && recognition){
      try{ recognition.stop(); }catch(e){}
    }
  }, 8000);
}

function showErrorMsg(msg){
  el('heard').textContent = '';
  el('result').classList.add('show');
  const fb = el('feedback');
  fb.className = 'feedback retry';
  fb.textContent = msg;
}

/* ---------- 錄音：點擊切換模式 ---------- */
const MIN_REC_MS = 1500; // 最小錄音時間,防止太快 stop

function startRecording(){
  if(!SRClass) return;
  warmUpMic();
  speechSynthesis.cancel();
  isRecording = true;
  gotResult = false;
  finalTranscript = '';
  recStartTime = Date.now();
  el('recBtn').classList.add('recording');
  el('liveTranscript').textContent = '正在聆聽...';
  el('result').classList.remove('show');
  recognition = buildRecognition();
  try{ recognition.start(); }catch(e){
    isRecording = false;
    el('recBtn').innerHTML = '🎙';
    el('recBtn').classList.remove('recording');
    el('liveTranscript').textContent = '';
    showErrorMsg('無法啟動麥克風，重新整理頁面後再試一次。');
  }
  // 啟動超時保護
  resetRecTimeout();
}

function stopRecording(){
  if(!isRecording) return;
  // 確保至少錄 MIN_REC_MS 毫秒
  const elapsed = Date.now() - recStartTime;
  if(elapsed < MIN_REC_MS){
    setTimeout(() => {
      if(isRecording && recognition){
        try{ recognition.stop(); }catch(e){}
      }
    }, MIN_REC_MS - elapsed);
  } else {
    if(recognition) try{ recognition.stop(); }catch(e){}
  }
}

  el('aiStatus').textContent = '';

  const prompt = `你是一個專業的英文老師。請根據情境：「${scenario}」，生成相關的英文練習題目。
請嚴格輸出 JSON 陣列，包含 10 個單字、5 個片語、5 個句子。每個物件必須有 en, zh, cat 三個屬性。cat 必須固定填入 "(AI) ${scenario}"。

格式範例：
[

]
不要輸出任何 Markdown 語法（例如 \`\`\`json ），只要純 JSON 文字陣列即可。`;

  try {

      })
    });
    
    if(!res.ok) {
      let errText = '';
      try {
        const errJson = await res.json();
        errText = errJson.error.message;
      } catch(e) {
        errText = res.statusText;
      }
      throw new Error(`API 請求失敗 (${res.status}): ${errText}`);
    }
    
    const data = await res.json();
    let resultText = data.candidates[0].content.parts[0].text;
    resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
    const items = JSON.parse(resultText);
    
    const catName = `(AI) ${scenario}`;
    items.forEach(it => {
      if(!it.en) return;
      const wordCount = it.en.trim().split(/\s+/).length;
      let targetKey = 'word';
      if(wordCount > 3 || it.en.includes('?')) targetKey = 'sentence';
      else if(wordCount > 1) targetKey = 'phrase';
      
      const stage = STAGES.find(s => s.key === targetKey);
      if(stage) {
        const newItem = { en: it.en, zh: it.zh, cat: catName, _type: targetKey };
        stage.items.push(newItem);
        aiGeneratedItems.push(newItem);
        if(WORD_BANK[targetKey]) {
          WORD_BANK[targetKey].push(newItem);
        }
      }
    });
    
    localStorage.setItem('speakup_ai_items', JSON.stringify(aiGeneratedItems));
    
    el('aiStatus').textContent = '✅ 生成成功！已幫你切換到新類別。';
    setTimeout(() => {
      el('aiModal').classList.remove('show');
    }, 1500);
    
    activeCat = catName;
    itemIdx = 0;
    saveProgress();
    render();
    
  } catch(err) {
    el('aiStatus').textContent = '❌ 生成失敗：' + err.message;
  }
  
  btn.disabled = false;
  btn.textContent = '🚀 立即生成題目';
};

checkMobile();
initBank();
populateCustomStageSelect();
setupRecognition();
// Initial App mode setup
setAppMode(appMode, true);
</script>
</body>
</html>
